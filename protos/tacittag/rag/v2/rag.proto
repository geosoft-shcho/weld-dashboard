// ============================================================================
// RagService - 프로젝트 TEXT layer(STT) 기반 RAG Q&A (v2)
//
// welding-pose REST(/api/v1/rag/*)와 1:1 매핑되는 Connect contract 초안이다.
// BFF(tacit-tag) repo의 proto/tacittag/rag/v2/rag.proto 로 복사 후 buf generate 한다.
// ============================================================================
//
//
// 수정 이력:
//   2026-06-19 · welding-pose · AskQuestion·IndexProject REST 스키마와 동기화
//   2026-06-24 · welding-pose · session_id·GetSessionHistory 추가
// ============================================================================

syntax = "proto3";

package tacittag.rag.v2;

option go_package = "tacittag/internal/gen/tacittag/rag/v2;ragv2";

// RagService — STT TEXT segment 검색 + LLM 답변.
//
// Connect URL: {BFF_BASE_URL}/tacittag.rag.v2.RagService/{Method}
//
// REST 매핑 (welding-pose):
//   AskQuestion       -> POST /api/v1/rag/ask
//   GetSessionHistory -> GET  /api/v1/rag/sessions/{sessionId}/messages
//   IndexProject      -> POST /api/v1/rag/index
//
service RagService {
  // 프로젝트 TEXT layer에서 관련 구간 검색 후 LLM 답변 + citations 반환.
  // session_id 생략 시 새 세션 생성. 동일 session_id로 후속 질문 시 LLM 컨텍스트 유지.
  rpc AskQuestion(AskQuestionRequest) returns (AskQuestionResponse);

  // 세션 대화 기록 조회. 프론트가 화면에 지난 질문·답변을 렌더링할 때 사용.
  rpc GetSessionHistory(GetSessionHistoryRequest) returns (GetSessionHistoryResponse);

  // TEXT layer를 Redis 벡터 인덱스에 upsert. watcher 자동 인덱싱 외 수동/재빌드용.
  rpc IndexProject(IndexProjectRequest) returns (IndexProjectResponse);
}

// AskQuestion — 채팅 Q&A

message AskQuestionRequest {
  // 대상 프로젝트 ID (prj_*). 검색·필터 키. 권장.
  string project_id = 1;

  // 사용자 질문 (예: "용접 장면이 몇 초에 나와?").
  string question = 2;

  // 검색할 chunk 상한. 기본 5, 최대 20 (welding-pose REST와 동일).
  int32 top_k = 3;

  // legacy scope. project_id가 없을 때만 사용.
  string media_id = 4;

  // 기존 대화 세션 ID. 생략 시 새 세션 생성.
  string session_id = 5;
}

message AskQuestionResponse {
  // LLM이 citations 기반으로 생성한 답변.
  string answer = 1;

  // 요청과 동일한 프로젝트 ID.
  string project_id = 2;

  // 표시용 legacy ID. 검색 키는 project_id.
  string media_id = 3;

  // 근거 구간 목록. UI에서 클릭 시 start_sec/end_sec으로 video seek.
  repeated Citation citations = 4;

  // 대화 세션 ID. 후속 질문·히스토리 조회에 사용.
  string session_id = 5;
}

// STT segment 한 구간에 대한 검색 근거.
message Citation {
  // 구간 시작(초). video player seek target.
  double start_sec = 1;

  // 구간 끝(초).
  double end_sec = 2;

  // 해당 구간 STT 텍스트(또는 chunk 텍스트).
  string text = 3;

  // hybrid 검색 유사도 점수 (0~1 근처).
  double score = 4;

  // TEXT layer ID (lyr_*).
  string layer_id = 5;

  // segment ID (seg_*).
  string segment_id = 6;
}

// GetSessionHistory — 세션 대화 기록

message GetSessionHistoryRequest {
  string session_id = 1;
}

message GetSessionHistoryResponse {
  string session_id = 1;
  string project_id = 2;
  repeated ChatMessage messages = 3;
}

message ChatMessage {
  string id = 1;
  // "user" | "assistant"
  string role = 2;
  string content = 3;
  repeated Citation citations = 4;
  // ISO8601 UTC (REST createdAt과 동일)
  string created_at = 5;
}

// ///////////////////////////////////////////////////////////////////////////
// IndexProject — 수동/재빌드 인덱싱
// ///////////////////////////////////////////////////////////////////////////

message IndexProjectRequest {
  // 인덱싱 대상 프로젝트. project_id 또는 media_id 중 하나 필수.
  string project_id = 1;

  string media_id = 2;

  // true면 기존 project 인덱스 삭제 후 전체 재인덱싱.
  bool rebuild = 3;

  // 아래는 welding-pose REST 고급 옵션. 일반 프론트/BFF 호출에서는 생략.
  string text_layer = 4;
  string project_dir = 5;
  string data_dir = 6;
}

message IndexProjectResponse {
  // upsert된 chunk 개수.
  int32 indexed_chunks = 1;

  string project_id = 2;
  string media_id = 3;
}
