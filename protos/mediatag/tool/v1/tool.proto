// ============================================================================
// ToolService - 도구 등록과 도구 실행 1건 (v1)
// tacit-db `tacit.tool`·`tacit.tool_run`을 다룬다. 도구는 서비스로 부르는 처리 전부다 — AI 모델
// (STT·포즈·VLM)과 pdf-to-text·음성 추출 같은 처리 도구. 실행 1건은 run_id로 식별한다(작업 1회
// job_id와 다름). 결과는 항상 provenance가 있는 새 Clip이나 파생 Asset으로 남는다 — 기존 레이어
// 덮어쓰기(result_target·write_mode)는 없다.
// AI 서버와의 계약은 tacittag.inference.v2 external_inference.proto를 그대로 쓴다.
// 설계: tacit docs/설계/엔티티.md §7·§8
// ============================================================================
//
// 작성자: geosoft-Server
// 최초 작성: 2026-09-29
//
// 수정 이력:
//   2026-10-08  geosoft-Server: ListTools는 켜진 도구만(include_disabled로 전부), UpdateTool은 update_mask에 든 칸만 고침
//   2026-10-07  geosoft-Server: tool_id·run_id·output_asset_ids를 숫자(int64)로. 대상은 target_id(글자) 대신 RunTarget(job_id·asset_id·clip_id 중 하나)
//   2026-09-29  geosoft-Server: tacit-tag tacittag.inference.v2(common·model_registry·
//                inference_run)를 합쳐 최초 정의 — pattern·dispatch 추가, project_id·
//                source_layer_id·result_layer_id → trigger·target_id, output_shape·
//                output_layer_kind·result_target·write_mode 삭제
//   2026-09-29  geosoft-Server: 오토태깅 대상 ID tml_ → JOB-(타임라인은 job_id로 식별)
//   2026-09-30  geosoft-Server: 추론 1건 Job → Run(InferenceJobService → InferenceRunService,
//                job_uuid → run_id) — 작업 1회(tacit.job, job_id)와 이름이 겹쳐서
//   2026-09-30  geosoft-Server: 모델 → 도구(inference → tool 도메인, InferenceModelService·
//                InferenceRunService → ToolService 하나, model_id → tool_id) — 음성 추출·pdf-to-text
//                같은 AI가 아닌 처리도 같은 틀로 등록·실행·기록하므로
//   2026-09-30  geosoft-Server: MANUAL 대상에 Asset(ast_) 추가, ToolRun.output_asset_ids, 내장 도구 즉시 실행
// ============================================================================

syntax = "proto3";

package mediatag.tool.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "mediatag/asset/v1/asset.proto";

option go_package = "gen/protobuf/mediatag/tool/v1;toolv1";

service ToolService {
  // 도구 목록. 기본은 켜진(enabled) 도구만 — 화면의 도구 고르기용. 꺼진 도구까지 받으려면 include_disabled를 켠다
  // (도구 관리 화면, 실행 이력·클립 출처의 도구 이름 찾기).
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc CreateTool(CreateToolRequest) returns (CreateToolResponse);
  // 도구를 고친다(update_mask에 든 칸만 — 다른 수정 RPC와 같다). tool.tool_id 필수. 켜고 끄기는 update_mask "enabled".
  // 고칠 수 있는 칸: name, endpoint, remote_model_name, tool_version, pattern, payload_kind, supported_input_kinds, unit,
  // dispatch, enabled.
  rpc UpdateTool(UpdateToolRequest) returns (UpdateToolResponse);
  // 실행 이력이 있으면 FailedPrecondition — 대신 enabled=false로 끈다.
  rpc DeleteTool(DeleteToolRequest) returns (DeleteToolResponse);

  // 도구 하나를 대상 하나에 돌려 달라고 요청한다. 실행 한 건을 만들어 대기열에 넣고 바로 돌려준다(status = QUEUED) —
  // 끝날 때까지 기다리지 않는다. 결과는 GetRun(wait_for_terminal)으로 받고, 도구가 만든 파일은 output_asset_ids에 있다.
  //   tool_id: 돌릴 도구(ListTools). target: 무엇에 돌릴지 — asset_id·clip_id·job_id 중 하나.
  //   trigger: MANUAL(사람이 한 건을 돌림 — 대상은 Asset 하나 또는 Clip 하나), AUTO_TAGGING(작업의 타임라인 전체 — 대상은 작업).
  //            ASSET_UPLOADED는 보내지 않는다 — 파일을 올릴 때 서버가 스스로 만드는 후처리 실행의 표시다(보내면 InvalidArgument).
  // 내장 도구(audio-extract·asset-postprocess)는 서버 안 워커가, 외부 도구(STT·포즈)는 서버가 그 도구의 서버에 보내 실행한다.
  // 어느 쪽이든 부르는 방법은 같다.
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  // 화면 재진입 시 진행 중 실행 복구용. 짧은 폴링으로 주기 호출한다.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
}

enum ToolPattern {
  TOOL_PATTERN_UNSPECIFIED = 0;
  TOOL_PATTERN_PUSH = 1;   // 외부 도구가 콜백으로 결과를 보낸다(STT 등)
  TOOL_PATTERN_PULL = 2;   // 우리가 결과를 확인하러 간다(Pose Bridge, 동기 VLM)
}

enum ToolUnit {
  TOOL_UNIT_UNSPECIFIED = 0;
  TOOL_UNIT_FRAME = 1;
  TOOL_UNIT_SECOND = 2;
}

enum ToolDispatch {
  TOOL_DISPATCH_UNSPECIFIED = 0;
  TOOL_DISPATCH_MANDATORY = 1; // Asset 등록 즉시 자동 큐잉
  TOOL_DISPATCH_ON_DEMAND = 2; // 오토태깅이 필요할 때만
}

enum RunTrigger {
  RUN_TRIGGER_UNSPECIFIED = 0;
  RUN_TRIGGER_MANUAL = 1;         // 사람이 직접 요청. target = Clip(재계산) 또는 Asset(예: 음성 추출)
  RUN_TRIGGER_AUTO_TAGGING = 2;   // target = Timeline(= 작업, JOB-)
  RUN_TRIGGER_ASSET_UPLOADED = 3; // target = Asset, 서버 전용
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_QUEUED = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_SUCCEEDED = 3;
  RUN_STATUS_FAILED = 4;
  RUN_STATUS_CANCELED = 5;
}

message Tool {
  int64 tool_id = 1;            // 서버 발급(Create 때 보낸 값은 무시)
  string name = 2;
  string endpoint = 3;          // 도구 고유 URL 또는 공용 게이트웨이 base URL. mediatag 안에서 도는 도구는 빈값
  string remote_model_name = 4; // 게이트웨이일 때 그 안의 모델 이름
  string tool_version = 5;      // Run 생성 시 결과 provenance로 복사(스냅샷)
  ToolPattern pattern = 6;
  string payload_kind = 7;      // 정보용 힌트
  repeated mediatag.asset.v1.AssetKind supported_input_kinds = 8;
  ToolUnit unit = 9;
  ToolDispatch dispatch = 10;
  bool enabled = 11;
}

message ToolRun {
  int64 run_id = 1;
  int64 tool_id = 2;
  RunTrigger trigger = 3;
  reserved 4;                   // 예전 target_id(글자, 접두어로 종류 구분)
  RunStatus status = 5;
  string external_job_id = 6;   // pull 패턴일 때 외부 시스템의 job id
  string error_code = 7;        // FAILED일 때
  string error_message = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  // 아래는 저장하지 않는 실행 중 파생 값(tacit-tag 설계-23 §7.1)
  int32 queue_position = 11;    // 같은 호스트 대기열 순번(1부터). QUEUED가 아니면 0
  int32 queue_length = 12;
  double progress_percent = 13; // 0~100. 진행 신호가 없으면 0
  int32 estimated_remaining_seconds = 14; // 0이면 미제공
  int32 attempt_count = 15;     // 디스패치 재시도 누적
  // 이 실행이 만든 파생 Asset(provenance.run_id로 찾는다, 저장하지 않음)
  repeated int64 output_asset_ids = 16;
  RunTarget target = 17;        // 대상이 지워진 실행은 비어 있다
}

// 도구를 돌리는 대상. 셋 중 하나만 채운다.
message RunTarget {
  oneof target {
    int64 job_id = 1;   // 그 작업의 타임라인 전체
    int64 asset_id = 2;
    int64 clip_id = 3;
  }
}

message ListToolsRequest {
  bool include_disabled = 1; // true면 꺼진 도구까지
}

message ListToolsResponse {
  repeated Tool tools = 1;
}

message CreateToolRequest {
  Tool tool = 1;
}

message CreateToolResponse {
  Tool tool = 1;
}

message UpdateToolRequest {
  Tool tool = 1;                           // tool.tool_id 필수
  google.protobuf.FieldMask update_mask = 2; // 필수. 여기에 든 칸만 바뀐다
}

message UpdateToolResponse {
  Tool tool = 1;
}

message DeleteToolRequest {
  int64 tool_id = 1;
}

message DeleteToolResponse {}

message StartRunRequest {
  int64 tool_id = 1;
  RunTrigger trigger = 2;
  reserved 3;              // 예전 target_id
  RunTarget target = 4;
}

message StartRunResponse {
  ToolRun run = 1;         // status=QUEUED
}

message GetRunRequest {
  int64 run_id = 1;
  bool wait_for_terminal = 2;   // true면 종료 상태 또는 상한까지 대기(long-poll)
  int32 wait_timeout_seconds = 3; // 0이면 30, 최대 600. 종료되면 즉시 응답
}

message GetRunResponse {
  ToolRun run = 1;
}

message ListRunsRequest {
  // 대상(작업·Clip·Asset) 기준. 작업을 주면 그 타임라인 Clip 대상 실행도 포함한다.
  reserved 1;              // 예전 target_id
  RunTarget target = 2;
}

message ListRunsResponse {
  repeated ToolRun runs = 1; // 생성 순
}

message CancelRunRequest {
  int64 run_id = 1;
}

message CancelRunResponse {
  ToolRun run = 1;
}
