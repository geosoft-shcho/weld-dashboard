// ============================================================================
// AssetService - 파일(Asset) 조회·삭제·파생과 작업 첨부 (v1)
// tacit-db `tacit.asset`·`asset_provenance`·`job_asset`을 다룬다(스키마 지도 "파일" 묶음). Asset은 완전
// 불변이라 수정 RPC가 없다. 바이트 등록은 적재기(수집)나 HTTP 업로드(POST /assets?file_name=…, 본문 = 파일 바이트)가 하고,
// 바이트 조회는 content_url(정적 /files/<storage_path>, Range 지원)로 한다. ID만 있으면
// /assets/{asset_id}/content가 storage_path를 조회해 같은 파일로 리다이렉트한다.
// 설계: tacit docs/설계/엔티티.md §6, 공통키 및 작업 타임라인 통합 설계.md §3·§3.1
// ============================================================================
//
// 작성자: geosoft-Server
// 최초 작성: 2026-09-29
//
// 수정 이력:
//   2026-10-19  geosoft-Server: MergeAssets — 중복 사본을 기준 하나로 합치기(dry_run으로 미리 셈)
//   2026-10-19  geosoft-Server: 중복 정리 — ListDuplicateAssets 판정(mergeable·reason)·결정·사본별 참조 수, ResolveDuplicateGroup
//   2026-10-19  geosoft-Server: ListAssetsRequest file_name·equipment_id·unattached_only, Asset.display(종류별 표시 줄)
//   2026-10-13  geosoft-Server: properties.start_time_ns — 영상·음성 파일의 첫 시각
//   2026-10-13  geosoft-Server: Delete* 주석에 삭제 방식(행을 실제로 지움) 명시 — 삭제는 Delete 하나, 방식은 주석에
//   2026-10-08  geosoft-Server: ListUploadFormats — 화면 업로드(POST /assets)가 받는 자료 형식 표
//   2026-10-07  geosoft-Server: equipment_id를 숫자(int64)로
//   2026-10-07  geosoft-Server: 화면 업로드 주소(POST /assets) 안내 — RPC는 그대로
//   2026-10-07  geosoft-Server: asset_id·parent_asset_id·run_id·tool_id를 숫자(int64)로 — 시스템 ID는 모두 DB가 매기는 번호
//   2026-10-07  geosoft-Server: job_id·pass_id를 숫자(int64)로
//   2026-09-29  geosoft-Server: tacit-tag tacittag.asset.v2를 tacit-db 기준으로 옮겨 최초 정의
//                — display_name·revision·UpdateAsset 삭제(파일명 불변), origin_asset_id → provenance,
//                  asset_kind 자유 문자열 → AssetKind enum, embedded_meta_json → properties
//   2026-09-29  geosoft-Server: 첨부 RPC를 WorkService에서 옮겨 옴
//   2026-09-30  geosoft-Server: ListDuplicateAssets 추가, Asset.source_path 추가(중복 허용·확인, 일괄 적재 원본 위치)
//   2026-09-29  geosoft-Server: AssetKind REGION 추가
//   2026-09-29  geosoft-Server: 첨부의 page_start·page_end 삭제(작업의 원본 PDF 쪽은 성적서 세트에 있음)
//   2026-09-30  geosoft-Server: Provenance job_uuid·model_id·model_version → run_id·tool_id·tool_version
//   2026-09-30  geosoft-Server: ExtractAudio 삭제 — 음성 추출은 도구(ToolService.StartRun, "audio-extract")
//   2026-10-01  geosoft-Server: Asset.duration_ns(기록 구간 길이), collected_at·recorded_at 뜻 명확히
// ============================================================================

syntax = "proto3";

package mediatag.asset.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/protobuf/mediatag/asset/v1;assetv1";

service AssetService {
  // 외부 source URL(fileservice://...)에서 서버가 바이트를 가져와 Asset으로 등록한다.
  // 미구현(UNIMPLEMENTED) — 허용 주소 규칙(SSRF 방지)과 함께 업로드 경로를 설계할 때 만든다.
  rpc ImportAssetFromSource(ImportAssetFromSourceRequest) returns (ImportAssetFromSourceResponse);
  // Asset 목록(페이지·kind 필터·부모 필터). 작업별 목록은 ListJobAssets.
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse);
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);
  // 행과 저장된 파일을 실제로 지운다(되돌릴 수 없음).
  // 첨부(job_asset)·파생 부모(다른 Asset의 parent_asset_id)·성적서 원본으로 쓰이는 Asset은 FailedPrecondition.
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse);
  // 내용(sha256)이 같은 Asset 묶음 목록. 중복은 등록을 막지 않고 여기서 확인해 사람이 정리한다.
  // 묶음마다 합칠 수 있는지(mergeable)를 서버가 판정한다 — 화면이 같은 조건을 따로 들고 있지 않게.
  // 기본은 사본마다 기록 시각이 다른 묶음(예시 사본)과 정리한 묶음을 뺀다. 정리한 묶음이라도 그 뒤 새 사본이 들어오면 다시 뜬다.
  rpc ListDuplicateAssets(ListDuplicateAssetsRequest) returns (ListDuplicateAssetsResponse);
  // 중복 묶음을 "그대로 둔다"고 기록한다(합치지 않음). 같은 sha256의 결정이 있으면 덮어쓴다.
  // member_asset_ids가 지금 묶음의 사본과 다르면(그사이 새 사본이 들어왔거나 지워졌으면) FailedPrecondition — 다시 보고 결정한다.
  // 묶음이 없으면(사본이 하나 이하) NotFound, keep_asset_id가 사본이 아니면 InvalidArgument.
  rpc ResolveDuplicateGroup(ResolveDuplicateGroupRequest) returns (ResolveDuplicateGroupResponse);
  // 같은 내용의 사본 여럿을 하나(keep)로 합친다. 첨부·클립·파생·성적서·도구 실행 참조를 keep으로 옮기고 사본 행을 지운다.
  // 사본의 파일도 지운다(되돌릴 수 없음). dry_run이면 바꾸지 않고 옮겨질 수만 센다.
  // 합칠 조건(ListDuplicateAssets의 mergeable과 같은 판정)이 안 맞으면 FailedPrecondition, 없는 번호면 NotFound.
  // 성공하면 묶음의 결정이 MERGED(기준 keep)가 된다 — 같은 내용이 또 들어오면 그 사본만 새로 뜬다.
  rpc MergeAssets(MergeAssetsRequest) returns (MergeAssetsResponse);
  // 화면 업로드(POST /assets, multipart)가 받는 자료 형식. 서버는 파일 내용으로 종류를 정한다 — 확장자는 파일 선택 창에
  // 쓸 안내 값이다. 표에 없는 파일도 올릴 수 있고(종류 미지정으로 등록만), 실행 파일은 거절한다.
  rpc ListUploadFormats(ListUploadFormatsRequest) returns (ListUploadFormatsResponse);
  // 음성 추출 같은 파생 만들기는 도구다 — ToolService.StartRun(도구 "audio-extract", 대상 = 영상 Asset).

  // 첨부(job_asset) — "이 작업의 자료인가". Clip으로 놓으면 서버가 자동 첨부하므로, 이 RPC는
  // 타임라인에 놓지 않고 작업 자료로만 둘 때(PDF 등)와 패스를 고칠 때 쓴다.
  // 작업의 첨부 목록
  rpc ListJobAssets(ListJobAssetsRequest) returns (ListJobAssetsResponse);
  // 첨부. 이미 첨부돼 있으면 pass_id만 고친다(upsert).
  // pass_id가 다른 작업의 패스면 InvalidArgument.
  rpc AttachAsset(AttachAssetRequest) returns (AttachAssetResponse);
  // Clip이나 매칭된 성적서 세트가 쓰는 첨부면 FailedPrecondition.
  rpc DetachAsset(DetachAssetRequest) returns (DetachAssetResponse);
}

// 소비(렌더링) 방식 기준 분류. 엔티티.md §6.1 + ocr_json. DB CHECK와 같은 목록.
enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  ASSET_KIND_VIDEO = 1;
  ASSET_KIND_AUDIO = 2;
  ASSET_KIND_IMAGE = 3;
  ASSET_KIND_DOCUMENT = 4;   // PDF 등
  ASSET_KIND_POSE = 5;
  ASSET_KIND_SUBTITLE = 6;
  ASSET_KIND_TIMESERIES = 7; // 센서 csv·xlsx
  ASSET_KIND_POINTCLOUD = 8; // 깊이카메라 원본(브라우저 재생 불가)
  ASSET_KIND_OCR_JSON = 9;
  ASSET_KIND_REGION = 10;    // 영상 속 영역(박스) 시퀀스 — 검출·추적 결과
}

message Asset {
  int64 asset_id = 1;        // DB가 매기는 번호
  AssetKind kind = 2;
  string file_name = 3;      // 등록 시점 파일명, 불변
  string sha256 = 4;         // 중복 제거 키 아님(같은 해시 여럿 가능)
  string mime_type = 5;
  int64 size_bytes = 6;
  // kind별 실측값(해상도·fps·채널 등). 영상·음성에는 start_time_ns가 있다 — 파일에 적힌 첫 프레임·샘플의 시각(ns).
  // 잘라 낸 영상은 0이 아니어서 브라우저의 video.currentTime이 이 값부터 시작한다. 화면은 start_time_ns + Asset 축 위치로 찾아간다.
  google.protobuf.Struct properties = 7;
  int64 equipment_id = 8;    // 수집 장비. 0이면 모름
  google.protobuf.Timestamp collected_at = 9; // 적재 시각 = 저장소에 들어온 시각(촬영·기록 시각이 아님)
  google.protobuf.Timestamp recorded_at = 10; // 기록 시작 = 첫 샘플·프레임의 절대시각(선택). 파일 안 시각(t_ns·영상 PTS)은 여기서 0
  optional int64 duration_ns = 14; // 자료 자체 길이(영상·음성·t_ns CSV). recorded_at부터 이만큼이 기록 구간
  Provenance provenance = 11; // 파생·추론 Asset만. 원본 업로드면 비어 있음
  string content_url = 12;   // 응답 전용: /files/<storage_path>. 저장하지 말 것 — 저장은 asset_id로(저장 방식이 바뀌면 경로도 바뀐다)
  string source_path = 13;   // 일괄 적재한 원본 위치. 화면 업로드면 빈값
  int32 child_count = 15;    // 응답 전용: 이 Asset으로 만든 파생(자식) 수. 0보다 크면 ListAssets(parent_asset_id)로 펼친다
  // 응답 전용: 화면에 보일 정보(라벨·값) — 순서대로 그린다. 값이 없는 줄은 빠진다. 기계가 읽을 값은 properties.
  repeated DisplayField display = 16;
}

message DisplayField {
  string label = 1; // '해상도'
  string value = 2; // '896 × 504'
}

// 생성 경위. run_id·tool_id·tool_version은 셋 다 있거나 셋 다 없다(엔티티.md §6.2).
message Provenance {
  string operation = 1;      // 'text_extraction', 'depth_colormap', 'stt' 등
  int64 run_id = 2;          // 도구 실행 1건(ToolRun). 도구를 거치지 않았으면 0
  int64 tool_id = 3;
  string tool_version = 4;
  reserved 5;                // 예전 input_asset_ids(부모 여럿) — 부모는 하나라 parent_asset_id로 바꿈
  reserved "input_asset_ids";
  google.protobuf.Struct parameters = 6;
  int64 parent_asset_id = 7; // 무엇으로 만들었나(부모는 하나). 부모 없이 만든 것이면 0. 에셋 트리는 이 값으로 잇는다
}

message ImportAssetFromSourceRequest {
  string source_url = 1;
}

message ImportAssetFromSourceResponse {
  Asset asset = 1;
}

message ListAssetsRequest {
  int32 page_size = 1;   // 기본 50, 최대 200
  string page_token = 2; // 비어 있으면 첫 페이지
  AssetKind kind = 3;    // UNSPECIFIED면 전체
  int64 parent_asset_id = 4; // 설정하면 그 Asset의 자식(그걸로 만든 파생)만 — 에셋 트리를 한 단계 펼칠 때
  string file_name = 5;      // 파일 이름 부분 일치(대소문자 무시)
  int64 equipment_id = 6;    // 그 장비가 기록한 것
  bool unattached_only = 7;  // 어느 작업에도 첨부(job_asset)되지 않은 것 — 작업 미지정
}

message ListAssetsResponse {
  repeated Asset assets = 1;
  string next_page_token = 2; // 비어 있으면 마지막 페이지
}

message GetAssetRequest {
  int64 asset_id = 1;
}

message GetAssetResponse {
  Asset asset = 1;
}

message DeleteAssetRequest {
  int64 asset_id = 1;
}

message DeleteAssetResponse {}

message ListDuplicateAssetsRequest {
  int32 page_size = 1;   // 묶음 수 기준. 기본 50, 최대 200
  string page_token = 2;
  bool include_time_shifted = 3; // 사본마다 기록 시각이 다른 묶음도(기본은 뺀다 — 예시 공사의 시각만 옮긴 사본)
  bool include_resolved = 4;     // 정리한 뒤 새 사본이 없는 묶음도
}

message ListDuplicateAssetsResponse {
  repeated DuplicateGroup groups = 1; // 가장 최근에 중복이 생긴 묶음부터
  string next_page_token = 2;
}

// 같은 sha256의 Asset들. 이름·원본 위치·첨부가 서로 다를 수 있다.
message DuplicateGroup {
  string sha256 = 1;
  repeated Asset assets = 2; // collected_at 순
  // 합칠 수 있는가: sha256·종류·기록 시각이 같고, 장비가 같거나 한쪽이 비고, 만든 경위(부모·만든 방법·매개변수)가 같고,
  // 파생이나 성적서 세트가 걸린 사본이 하나 이하일 때(그 사본을 남긴다).
  bool mergeable = 3;
  string reason = 4;                    // 못 합치면 이유: "기록 시각이 다름", "만든 경위가 다름" 등
  DuplicateResolution resolution = 5;   // 정리한 적이 있으면
  repeated int64 new_asset_ids = 6;     // 결정 뒤에 들어온 사본(이것 때문에 다시 뜬 것)
  repeated DuplicateMember members = 7; // assets와 같은 순서 + 사본마다 참조 수 — 비교 화면 · 기준 고르기(참조가 가장 많은 것)
}

message DuplicateMember {
  Asset asset = 1;
  MergeCounts refs = 2;          // 이 사본을 가리키는 참조 수(합치면 기준으로 옮겨질 것)
  repeated int64 job_ids = 3;    // 첨부된 작업
}

message MergeCounts {
  int32 attachments = 1;  // job_asset
  int32 clips = 2;        // 이 사본을 소스로 쓰는 클립
  int32 children = 3;     // 파생 자식
  int32 report_refs = 4;  // 성적서 세트 · 문서
  int32 tool_runs = 5;    // 이 사본을 대상으로 한 도구 실행
}

enum DuplicateDecision {
  DUPLICATE_DECISION_UNSPECIFIED = 0;
  DUPLICATE_DECISION_MERGED = 1;        // 기준 하나로 합침
  DUPLICATE_DECISION_KEEP_SEPARATE = 2; // 중복이 아니라고 보고 그대로 둠
}

message DuplicateResolution {
  DuplicateDecision decision = 1;
  int64 keep_asset_id = 2;                     // 합친 기준(그대로 두기면 화면에서 고른 기준, 0이면 없음)
  google.protobuf.Timestamp decided_at = 3;
}

message ResolveDuplicateGroupRequest {
  string sha256 = 1;
  repeated int64 member_asset_ids = 2; // 화면이 본 사본들(순서 무관)
  int64 keep_asset_id = 3;             // 선택
}

message ResolveDuplicateGroupResponse {}

message MergeAssetsRequest {
  int64 keep_asset_id = 1;
  repeated int64 merge_asset_ids = 2; // 지울 사본(keep과 sha256이 같아야 한다)
  bool dry_run = 3;                   // true면 바꾸지 않고 옮겨질 참조만 센다
}

message MergeAssetsResponse {
  Asset asset = 1;                    // 남은 에셋(dry_run이면 지금 모습)
  MergeCounts moved = 2;              // keep으로 옮긴(옮겨질) 참조 수
  repeated int64 deleted_asset_ids = 3;
  // 같은 작업에 keep과 사본이 다 붙어 있는데 패스가 다르면 keep 쪽 패스를 따르고 여기 적는다.
  repeated string warnings = 4;
}

message JobAsset {
  Asset asset = 1;
  int64 pass_id = 2;              // 0이면 작업 공용
}

message ListJobAssetsRequest {
  int64 job_id = 1;
  // 설정하면 그 패스의 첨부만. 0이면 작업 공용 첨부만.
  optional int64 pass_id = 2;
}

message ListJobAssetsResponse {
  repeated JobAsset assets = 1;
}

message AttachAssetRequest {
  int64 job_id = 1;
  int64 asset_id = 2;
  int64 pass_id = 3;              // 0이면 작업 공용
}

message AttachAssetResponse {
  JobAsset attachment = 1;
}

message DetachAssetRequest {
  int64 job_id = 1;
  int64 asset_id = 2;
}

message DetachAssetResponse {}

message ListUploadFormatsRequest {}

message ListUploadFormatsResponse {
  repeated UploadFormat formats = 1;
  int64 max_bytes = 2; // 파일 하나의 크기 한도
}

// 받는 자료 한 종류.
message UploadFormat {
  string name = 1;                 // video, depth_raw, audio, panel, imu, rpm, signals, pose, image, document
  string label = 2;                // 화면 표시 이름
  repeated string extensions = 3;  // 파일 선택 창 안내용(점 없이 소문자). 서버는 내용으로 판별한다
  string rule = 4;                 // 내용으로 판별하는 기준
  AssetKind kind = 5;
  bool time_origin_required = 6;   // metadata.timeOrigin(시간 0의 절대 시각)이 필요한가
  repeated string steps = 7;       // 올린 뒤 도는 후처리: properties, duration, normalize, timeline, report
  reserved 8; // 옛 processing_profile — 성적서인지는 올리는 사람이 고르지 않고 글자 인식 결과로 정한다
}
