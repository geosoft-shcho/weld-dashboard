// ============================================================================
// TraceService - 적재 흐름 추적 (v1)
// 파일 한 건이 들어와(수신) 등록 · 후처리를 거쳐 검색에 쓰일 수 있게(임베딩) 될 때까지 지난 단계를 이벤트로 쌓는다.
// 지금 상태는 마지막 이벤트다 — 그래프 · 노드는 두지 않는다(이벤트 이름 stage.step 위에 화면이 얹는다).
// tacit-db `tacit.trace` · `tacit.trace_event`를 읽기만 한다. 쓰는 곳은 업로드(POST /assets · /uploads) · 후처리 · 임베딩 통지다.
// 여정 번호는 업로드 응답으로 받는다: 이어 올리기 시작 응답 헤더 Upload-Trace-Id, 등록 응답 JSON traceId.
// 진행 화면은 1~2초 폴링한다.
// 설계: tacit docs/설계/적재 흐름 추적 설계.md
// ============================================================================
//
// 작성자: geosoft-Server
// 최초 작성: 2026-11-16
//
// 이벤트 이름(TraceEvent.name, 바꾸지 않는다):
//   receive.started · receive.screened · receive.done · receive.abandoned(오래 멈춘 업로드를 지움)
//   register.stored · register.asset · register.attached · register.duplicates
//   postprocess.run(후처리 단계 run 상태 — status가 queued · running · succeeded · failed · canceled, 처음 queued 줄의 detail에 queue · position · length)
//   tool.run(후처리 단계가 건 도구 run — 성적서 PDF의 pdf-to-text. 상태는 postprocess.run과 같다)
//   postprocess.props · postprocess.duration · postprocess.report · postprocess.normalize · postprocess.waveform(종류에 맞는 것만)
//   postprocess.placed(detail.clip_ids — 놓인 클립. 없으면 skipped)
//   embed.done(AI 서버 임베딩 통지마다, detail.started_at = AI 서버가 읽은 시각) — 통지가 오지 않으면 시간 제한 없이 RUNNING으로 기다린다
//   done.searchable(놓인 클립이 모두 임베딩됨) · done.stored(놓인 클립 없음 — 저장 · 첨부만)
// 구간 시간은 이벤트 at의 차이다. 임베딩은 진행 중에 대기인지 처리인지 모른다 — 끝난 뒤 started_at으로 나눈다.

syntax = "proto3";

package mediatag.trace.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "mediatag/run/v1/run.proto";

option go_package = "gen/protobuf/mediatag/trace/v1;tracev1";

service TraceService {
  // 최근 여정 목록, 새것부터. 진행 중 화면은 status = RUNNING으로 1~2초 폴링한다.
  rpc ListTraces(ListTracesRequest) returns (ListTracesResponse);
  // 여정 한 건과 이벤트 전부(오래된 것부터). 없으면 NotFound.
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
}

enum TraceStatus {
  TRACE_STATUS_UNSPECIFIED = 0;
  TRACE_STATUS_RUNNING = 1;
  TRACE_STATUS_DONE = 2;   // done.searchable · done.stored
  TRACE_STATUS_FAILED = 3; // 어느 단계에서 왜는 error_code · error_message와 그 이벤트
}

message Trace {
  int64 trace_id = 1;
  string source = 2;          // upload
  string file_name = 3;
  int64 total_bytes = 4;      // 이어 올리기는 시작할 때(Upload-Length), multipart는 다 받은 뒤 채운다(그전엔 0)
  int64 received_bytes = 5;
  int64 asset_id = 6;         // 등록 전이면 0
  string last_event = 7;      // 마지막 이벤트 이름. 끝났으면 done.searchable · done.stored
  TraceStatus status = 8;
  string error_code = 9;
  string error_message = 10;
  google.protobuf.Timestamp published_at = 11; // 발행 시각: 보내는 쪽(장비 · 클라이언트)이 자료를 내보낸 시각(업로드 metadata publishedAt, 선택, 그쪽 시계). 받은 시각은 created_at, 자료의 기록 시작은 Asset.recorded_at
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  // 아래는 지금 값(저장하지 않음) — 가진 것만 채운다
  // run은 여럿일 수 있다 — RetryPostprocess · 시각 바로잡기는 새 run을 같은 여정에 붙인다(자동 재시도는 같은 run, attempt_count만 늚).
  // run 번호는 events의 postprocess.run 줄마다 run_id로 남는다. 성적서 PDF 안의 pdf-to-text run은 postprocess.report의 detail.run_id.
  reserved 14; // run_id — run.run_id · events의 run_id와 겹쳐 뺌(2026-11-17)
  optional double progress_percent = 15;            // 수신 중이면 received_bytes / total_bytes
  repeated int64 embed_pending_clip_ids = 16;       // 임베딩 통지를 기다리는 클립
  mediatag.run.v1.Run run = 17;                     // 지금 기다리거나 도는 run(후처리 단계 · 그 단계가 건 도구) — 대기열 · 순번 · RunWait · 진행. 없으면 비움
}

message TraceEvent {
  int64 event_id = 1;
  string name = 2;            // stage.step(위 목록)
  string status = 3;          // started · ok · skipped · failed, postprocess.run은 run 상태
  int64 run_id = 4;           // 후처리 run(postprocess.run)이나 그 안의 run(postprocess.report의 pdf-to-text는 detail.run_id)
  google.protobuf.Struct detail = 5;
  string error_code = 6;
  string error_message = 7;
  google.protobuf.Timestamp at = 8;
}

message ListTracesRequest {
  TraceStatus status = 1;       // 비면 전부
  int64 asset_id = 2;           // 그 파일의 여정만
  repeated int64 trace_ids = 3; // 다중 업로드 화면: 이번에 올린 것들
  int32 page_size = 4;          // 기본 50, 최대 500
  string page_token = 5;        // 앞 응답의 next_page_token
}

message ListTracesResponse {
  repeated Trace traces = 1;
  string next_page_token = 2; // 더 없으면 비움
  int64 total_count = 3;      // 조건(status · asset_id · trace_ids)에 맞는 전체 건수 — KPI 카드는 page_size=1로 이것만 본다
}

message GetTraceRequest {
  int64 trace_id = 1;
}

message GetTraceResponse {
  Trace trace = 1;
  repeated TraceEvent events = 2;
}
