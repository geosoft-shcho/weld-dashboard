// ============================================================================
// RunService - 실행 1건(run)과 대기열 (v1)
// tacit-db `tacit.run`을 다룬다. run은 큐의 한 칸이다 — 도구 run(tool_id: STT · 포즈 · pdf-to-text · 음성 추출)이거나
// 파이프라인 단계 run(stage: 업로드 후처리)이다. 단계 run은 서버가 건다(업로드 · AssetService.RetryPostprocess).
// 도구 등록 · 관리는 ToolService, 실행은 여기다(권한을 서비스 단위로 가른다).
// 대기열: 단계 run은 단계 이름("postprocess"), 외부 도구(다른 서버가 처리 — STT · 포즈 · pdf-to-text)는 그 서버 주소(endpoint),
// 내장 도구(mediatag 안의 코드가 처리 — 음성 추출)는 "work". 대기열마다 오래된 것부터 따로 꺼낸다.
// 설계: tacit docs/설계/실행 단위와 큐 정리 설계.md
// ============================================================================
//
// 작성자: geosoft-Server
// 최초 작성: 2026-11-16 — ToolService의 StartRun · GetRun · ListRuns · CancelRun · GetQueue와 ToolRun을 옮김(ToolService에서는 지움).
//   ToolRun → Run(tool_id 또는 stage, parent_run_id), RunWait(QUEUED인 run이 왜 · 얼마나 기다리나).

syntax = "proto3";

package mediatag.run.v1;

import "google/protobuf/timestamp.proto";

option go_package = "gen/protobuf/mediatag/run/v1;runv1";

service RunService {
  // 도구 하나를 대상 하나에 돌려 달라고 요청한다. run을 큐에 넣고 바로 돌려준다(status = QUEUED) — 끝날 때까지 기다리지 않는다.
  // 결과는 GetRun(wait_for_terminal)으로 받고, 도구가 만든 파일은 output_asset_ids에 있다.
  //   tool_id: 돌릴 도구(ToolService.ListTools). target: asset_id · clip_id · job_id 중 하나.
  //   trigger: MANUAL(사람이 한 건을 돌림 — Asset 하나 또는 Clip 하나), AUTO_TAGGING(작업의 타임라인 전체 — 대상은 작업).
  //            ASSET_UPLOADED는 보내지 않는다 — 서버가 스스로 거는 실행의 표시다(보내면 InvalidArgument).
  //   MANUAL 대상: pdf-to-text는 PDF 클립(원본 PDF를 다시 인식하고 세트를 다시 세운다 — 본인 품목이 있거나 작업이 고른 세트가 있으면
  //   아무것도 지우지 않고 FAILED), audio-extract는 영상 Asset 또는 영상 클립(클립이면 원본 전체에서 뽑은 소리를 그 클립과 같은 구간에
  //   오디오 클립으로 놓는다). STT를 클립에 돌리면 그 클립 구간만 인식하고 자막 클립을 그 클립 위치 기준으로 놓는다. Asset에 돌리면
  //   그 파일이 붙은 작업마다 촬영 시각 기준으로 놓는다. 포즈도 같다.
  // 돌릴 수 없는 run은 기록만 남기고 바로 FAILED로 돌려준다: 처리할 서버가 연결되지 않은 도구면 error_code = not_connected,
  // 소리 없는 영상에 faster-whisper STT면 invalid_target.
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  // 대상 기준 run 목록(생성 순). 화면 재진입 시 진행 중 run 복구용으로 짧게 폴링한다.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // 서버 전체 대기열 — 기다리는(QUEUED) · 도는(RUNNING) run 전부(단계 · 도구)와 대기열마다 동시 수. 큐 모니터링 화면용으로 짧게 폴링한다.
  // 끝난 run은 ListRuns로 본다.
  rpc GetQueue(GetQueueRequest) returns (GetQueueResponse);
}

enum RunTrigger {
  RUN_TRIGGER_UNSPECIFIED = 0;
  RUN_TRIGGER_MANUAL = 1;         // 사람이 직접 요청(재시도 · 시각 바로잡기로 서버가 다시 건 후처리도)
  RUN_TRIGGER_AUTO_TAGGING = 2;   // target = 작업
  RUN_TRIGGER_ASSET_UPLOADED = 3; // 서버가 건 것: 업로드 후처리, 그 단계가 건 도구 run, 코멘트 STT
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_QUEUED = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_SUCCEEDED = 3;
  RUN_STATUS_FAILED = 4;
  RUN_STATUS_CANCELED = 5;
}

// run이 돌 대상. 셋 중 하나만 채운다.
message RunTarget {
  oneof target {
    int64 job_id = 1;   // 그 작업의 타임라인 전체
    int64 asset_id = 2;
    int64 clip_id = 3;
  }
}

// 실행 1건 — 큐의 한 칸.
message Run {
  int64 run_id = 1;
  oneof what {
    int64 tool_id = 2;  // 도구 run
    string stage = 3;   // 파이프라인 단계 run("postprocess")
  }
  int64 parent_run_id = 4;    // 단계가 건 도구 run이면 그 단계 run(성적서 PDF의 pdf-to-text). 끝나면 단계를 다시 건다. 아니면 0
  int64 trace_id = 5;         // 업로드 여정(TraceService.GetTrace). 업로드 후처리와 그 단계가 건 도구 run만, 수동 · 코멘트 STT는 0
  RunTrigger trigger = 6;
  RunTarget target = 7;       // 대상이 지워진 run은 비어 있다
  RunStatus status = 8;
  string error_code = 9;      // FAILED · CANCELED일 때(취소는 canceled)
  string error_message = 10;
  string external_job_id = 11; // 외부 도구 쪽 작업 번호(있으면)
  int32 attempt_count = 12;   // 꺼내 돌린 횟수(중단 · 실패로 다시 돌리면 늘어난다)
  google.protobuf.Timestamp created_at = 13; // 큐에 들어간 시각
  google.protobuf.Timestamp updated_at = 14;
  // RUNNING일 때 돌기 시작한 시각. 서버 안 run은 워커가 꺼낸 시각, 외부 도구는 진행 신호를 처음 받은 시각이라 진행 신호를 안 주는
  // 도구는 비어 있다 — 그때는 updated_at을 본다.
  google.protobuf.Timestamp started_at = 15;
  // 아래는 저장하지 않고 읽을 때 센다
  string queue = 16;          // 어느 대기열: "postprocess", "work", 외부 도구는 서버 주소(endpoint)
  int32 queue_position = 17;  // 같은 대기열 순번(1부터). QUEUED가 아니면 0
  int32 queue_length = 18;    // 그 대기열에서 기다리는 수(자신 포함). QUEUED가 아니면 0
  RunWait wait = 19;          // QUEUED일 때만 — 왜 · 얼마나 기다리나
  double progress_percent = 20;          // 0~100. 진행 신호가 없으면 0
  int32 estimated_remaining_seconds = 21; // 진행 속도로 어림한 남은 시간. 0이면 미제공
  repeated int64 output_asset_ids = 22;  // 이 run이 만든 파생 Asset
}

// QUEUED인 run이 왜 · 얼마나 기다리나. 실제 값만 준다 — 시작 예정 시각 같은 추정은 주지 않는다.
message RunWait {
  WaitReason reason = 1;
  int32 ahead = 2;    // 같은 대기열에서 내 앞 run 수
  int32 running = 3;  // 그 대기열에서 지금 도는 수
  int32 workers = 4;  // 그 대기열이 동시에 돌리는 수(외부 서버는 지금 1)
}

enum WaitReason {
  WAIT_REASON_UNSPECIFIED = 0;
  WAIT_REASON_QUEUE_AHEAD = 1;  // 앞에 기다리는 run이 있음
  WAIT_REASON_WORKERS_BUSY = 2; // 앞은 비었지만 자리가 다 참
  WAIT_REASON_RETRY = 3;        // 실패 · 중단으로 다시 기다림(attempt_count > 0)
  WAIT_REASON_DISPATCH_OFF = 4; // 이 도구를 보내는 디스패치가 꺼짐(MEDIATAG_PUBLIC_BASE_URL 없음) — 기다려도 시작하지 않는다
}

message StartRunRequest {
  int64 tool_id = 1;
  RunTrigger trigger = 2;
  RunTarget target = 3;
}

message StartRunResponse {
  Run run = 1; // status = QUEUED(돌릴 수 없으면 FAILED)
}

message GetRunRequest {
  int64 run_id = 1;
  bool wait_for_terminal = 2;     // true면 종료 상태 또는 상한까지 대기(long-poll)
  int32 wait_timeout_seconds = 3; // 0이면 30, 최대 600. 종료되면 즉시 응답
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  RunTarget target = 1; // 작업을 주면 그 타임라인 Clip 대상 run도 포함한다
}

message ListRunsResponse {
  repeated Run runs = 1; // 생성 순
}

message CancelRunRequest {
  int64 run_id = 1;
}

message CancelRunResponse {
  Run run = 1;
}

message GetQueueRequest {}

message GetQueueResponse {
  // 대기열마다 한 줄, 이름순. 서버 안 대기열(postprocess · work)은 비어도 나오고, 외부 서버는 run이 있을 때만 나온다.
  // 여정(TraceService)이 기다리는 중이면 Trace.run.queue로 여기서 그 대기열을 찾는다.
  repeated Queue queues = 1;
}

// 대기열 하나 — 이름은 Run.queue와 같다. 동시 수를 정하는 자원(이 서버의 워커 · 외부 서버의 자리)마다 하나다.
message Queue {
  string queue = 1;       // "postprocess", "work", 외부 도구는 서버 주소(endpoint)
  int32 workers = 2;      // 동시에 돌리는 수(외부 서버는 지금 1). running이 이만큼이면 나머지는 기다린다
  int32 running = 3;      // RUNNING run 수
  int32 waiting = 4;      // QUEUED run 수
  repeated Run runs = 5;  // RUNNING · QUEUED run, 오래된 것부터. 기다린 시간 = 지금 − created_at
}
