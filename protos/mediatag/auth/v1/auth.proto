// ============================================================================
// AuthService · AccountService - 로그인과 계정 관리 (v1)
// 계정은 서버가 직접 관리한다(아이디 · 비밀번호). 로그인하면 세션 토큰을 주고, 같은 값을 HttpOnly 쿠키
// `mediatag_session`으로도 심는다 — 같은 도메인의 브라우저는 쿠키만으로 RPC · /files · 업로드가 전부 통과한다.
// 쿠키를 못 쓰는 호출(스크립트, 다른 주소의 개발 프론트)은 `Authorization: Bearer <token>` 헤더로 보낸다.
//
// 계정 → 역할 하나 → 권한 묶음. 계정마다 역할이 하나 붙고, 역할은 관리자가 권한을 골라 만든다(AccountService의 Role RPC).
// 권한 목록은 서버가 정한다(ListPermissions) — 요청마다 권한 하나가 필요하다:
//   view            조회(Get* · List*), 파일 받기, 파형 · DTW 비교(GetPassWaveform), RagService.AskQuestion
//   work.edit       공사 · 작업 · 패스 · 작업자 · 장비 · 품목 만들기 · 고치기, 패스 삭제
//   asset.edit      업로드(/assets · /uploads), Asset 고치기 · 붙이기 · 떼기 · 병합, 코멘트(삭제 포함)
//   timeline.edit   타임라인 · 트랙 · 클립 · 라벨 만들기 · 고치기, 트랙 · 클립 삭제
//   report.edit     성적서 확인 · 보정
//   run.start       도구 실행 · 취소, 후처리 다시 걸기
//   delete          되돌릴 수 없는 삭제(Asset · 공사 · 작업 · 작업자 · 장비 · 품목 · 타임라인)
//   tool.manage     도구 등록 · 고치기 · 삭제, RAG 색인
//   account.manage  계정 · 역할 · 서버 연동 토큰 관리(AccountService 전부)
// 처음에는 역할 viewer · editor · admin이 들어 있다. 로그인만 하면 되는 것: GetCurrentAccount · ChangePassword.
// 로그인하지 않았으면 Unauthenticated(HTTP 401), 권한이 없으면 PermissionDenied(HTTP 403).
//
// 서버 연동 토큰: AI 서버 같은 다른 서버는 계정 대신 `X-Internal-Token: <토큰>` 헤더를 보낸다. 파일 받기(/assets/{id}/content ·
// /files/…)와 /internal/… 통지만 열리고 RPC · 업로드는 안 열린다. 관리자가 AccountService로 발급 · 폐기한다.
// 설계: tacit docs/설계/로그인 · 권한 설계.md
// ============================================================================
//
// 작성자: geosoft-Server
// 최초 작성: 2026-11-17
//
// 수정 이력:
//   2026-11-18  geosoft-Server: 서버 연동 토큰 — ListServiceTokens · CreateServiceToken · RevokeServiceToken(환경 변수 MEDIATAG_INTERNAL_TOKEN을 대신)

syntax = "proto3";

package mediatag.auth.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/protobuf/mediatag/auth/v1;authv1";

service AuthService {
  // 로그인. 아이디나 비밀번호가 틀리면 Unauthenticated(어느 쪽이 틀렸는지는 알려주지 않는다), 막힌 계정도 같다.
  // 같은 아이디로 5번 연달아 틀리면 1분 동안 ResourceExhausted. 응답과 함께 세션 쿠키를 심는다.
  rpc Login(LoginRequest) returns (LoginResponse);
  // 로그아웃 — 지금 세션을 지우고 쿠키를 비운다. 로그인하지 않았어도 성공한다.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // 지금 로그인한 계정. 화면이 처음 뜰 때 로그인 여부 · 역할을 알아내는 용도 — 로그인하지 않았으면 Unauthenticated.
  rpc GetCurrentAccount(GetCurrentAccountRequest) returns (GetCurrentAccountResponse);
  // 내 비밀번호 바꾸기. 지금 비밀번호가 틀리면 PermissionDenied. 바꾸면 이 계정의 다른 세션은 모두 끊긴다.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

// 계정 · 역할 관리 — account.manage 권한이 있어야 부를 수 있다.
service AccountService {
  // 계정 전부(막힌 계정 포함), 아이디 순.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  // 계정을 만든다. account.login_name · account.role_id · password 필수. 같은 아이디가 있으면 AlreadyExists.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  // 계정을 고친다(update_mask: display_name, role_id, inactive, password). account.account_id 필수. 아이디는 못 바꾼다.
  // password를 바꾸면 그 계정의 세션이 모두 끊긴다. 자기 계정의 role_id · inactive는 못 바꾼다(FailedPrecondition) —
  // 관리자가 하나도 남지 않는 일을 막는다. 계정은 지우지 않고 inactive로 막는다.
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);

  // 서버가 아는 권한 전부(이름과 설명) — 역할 편집 화면의 체크 목록.
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
  // 역할 전부, 번호 순.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  // 역할을 만든다. role.role_name 필수. 같은 이름이 있으면 AlreadyExists, 목록에 없는 권한은 InvalidArgument.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  // 역할을 고친다(update_mask: role_name, description, permissions — permissions는 통째로 바꾼다). role.role_id 필수.
  // 그 역할의 계정들에게 다음 요청부터 바로 먹는다. 자기 역할에서 account.manage는 뺄 수 없다(FailedPrecondition).
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  // 역할을 지운다. 그 역할을 쓰는 계정이 있으면 FailedPrecondition — 계정들의 역할을 먼저 바꾼다.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);

  // 서버 연동 토큰 전부(폐기한 것 포함), 번호 순. 토큰 원문은 없다.
  rpc ListServiceTokens(ListServiceTokensRequest) returns (ListServiceTokensResponse);
  // 토큰을 발급한다. name 필수(예: "ai-server"). 원문(token)은 이 응답에서 한 번만 준다 — 다시 볼 수 없다.
  // 같은 이름으로 여럿을 둘 수 있다: 교체는 새로 발급 → 상대 서버에 넣기 → 옛 토큰의 last_used_at이 멈춘 것을 보고 폐기.
  rpc CreateServiceToken(CreateServiceTokenRequest) returns (CreateServiceTokenResponse);
  // 토큰을 폐기한다(다음 요청부터 401). 되살리지 못한다 — 새로 발급한다. 없는 번호면 NotFound.
  // 토큰을 한 번도 발급하지 않았으면 서버는 X-Internal-Token을 검사하지 않는다(처음 붙일 때의 전환용).
  // 한 번이라도 발급했으면 전부 폐기해도 검사한다 — 통지 · 파일 받기는 401(새로 발급해 넣을 때까지 멈춤).
  rpc RevokeServiceToken(RevokeServiceTokenRequest) returns (RevokeServiceTokenResponse);
}

// 역할 = 권한 묶음.
message Role {
  int64 role_id = 1;               // 서버가 매기는 번호
  string role_name = 2;
  string description = 3;
  repeated string permissions = 4; // 권한 이름(ListPermissions의 key)
}

// 만든 · 고친 사람. 다른 서비스의 응답(공사 · 작업 · Asset · 클립 등의 created_by · updated_by)에 실린다.
// 칸이 비어 있으면(null) 사람이 아닌 일이다 — 업로드 뒤 후처리, 도구 결과, 성적서 추출, 로그인 도입 전에 만든 행.
message Author {
  int64 account_id = 1;
  string display_name = 2; // 계정의 이름, 없으면 아이디
}

message Permission {
  string key = 1;         // 예: "asset.edit"
  string description = 2; // 사람이 읽는 설명(한글)
}

message Account {
  int64 account_id = 1;    // 서버가 매기는 번호
  string login_name = 2;   // 로그인 아이디. 영문 소문자 · 숫자 · `.` `_` `-`, 3~32자(대문자로 보내면 소문자로 저장)
  string display_name = 3; // 화면에 보일 이름
  int64 role_id = 4;
  bool inactive = 5;       // 막힘 — 로그인할 수 없고 있던 세션도 바로 끊긴다
  google.protobuf.Timestamp created_at = 6;
  string role_name = 7;            // 응답 전용
  repeated string permissions = 8; // 응답 전용 — 역할의 권한. 화면은 이것으로 버튼을 가린다
}

message LoginRequest {
  string login_name = 1;
  string password = 2;
}

message LoginResponse {
  Account account = 1;
  string token = 2;                         // 세션 토큰. 쿠키를 못 쓰는 호출은 Authorization: Bearer <token>
  google.protobuf.Timestamp expires_at = 3; // 이 시각이 지나면 다시 로그인(로그인 후 7일)
}

message LogoutRequest {}
message LogoutResponse {}

message GetCurrentAccountRequest {}
message GetCurrentAccountResponse {
  Account account = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2; // 8~72바이트
}
message ChangePasswordResponse {}

message ListAccountsRequest {}
message ListAccountsResponse {
  repeated Account accounts = 1;
}

message CreateAccountRequest {
  Account account = 1;
  string password = 2; // 8~72바이트
}
message CreateAccountResponse {
  Account account = 1;
}

message UpdateAccountRequest {
  Account account = 1;
  google.protobuf.FieldMask update_mask = 2;
  string password = 3; // update_mask에 "password"가 있을 때 새 비밀번호
}
message UpdateAccountResponse {
  Account account = 1;
}

message ListPermissionsRequest {}
message ListPermissionsResponse {
  repeated Permission permissions = 1;
}

message ListRolesRequest {}
message ListRolesResponse {
  repeated Role roles = 1;
}

message CreateRoleRequest {
  Role role = 1;
}
message CreateRoleResponse {
  Role role = 1;
}

message UpdateRoleRequest {
  Role role = 1;
  google.protobuf.FieldMask update_mask = 2;
}
message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  int64 role_id = 1;
}
message DeleteRoleResponse {}

// 서버 연동 토큰. 사람 계정과 따로 — 비밀번호 · 역할 · 만료가 없다.
message ServiceToken {
  int64 token_id = 1;
  string name = 2;                               // 연동 이름. 접근 로그에 user=internal:<이름>
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp revoked_at = 4;      // 비면 살아 있음
  google.protobuf.Timestamp last_used_at = 5;    // 마지막으로 쓰인 시각(분 단위). 비면 아직 안 쓰임
}

message ListServiceTokensRequest {}
message ListServiceTokensResponse {
  repeated ServiceToken tokens = 1;
}

message CreateServiceTokenRequest {
  string name = 1;
}
message CreateServiceTokenResponse {
  ServiceToken service_token = 1;
  string token = 2; // 원문 — 이 응답에서만. 상대 서버의 X-Internal-Token에 넣는다
}

message RevokeServiceTokenRequest {
  int64 token_id = 1;
}
message RevokeServiceTokenResponse {
  ServiceToken service_token = 1;
}
