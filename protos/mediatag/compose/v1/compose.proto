// ============================================================================
// MediaComposeService·LabelService - 미디어 컴포즈(타임라인·트랙·클립 편집)와 라벨 어휘 (v1)
// 작업(job) 하나에 타임라인 하나이고 식별자도 job_id다(별도 timeline ID 없음). 타임라인은
// 처음 편집할 때(UpdateTimeline·ChangeTimelineStatus·CreateTrack) 서버가 만든다. Track은 행 묶음, Clip은
// 작업에 첨부된 파일(또는 라벨)을 타임라인 어디에 놓았는지다. 버전 비교(CAS)는 없다 — 수정은 필드
// 단위(update_mask)이고, 상태 전이만 현재 상태를 조건으로 건다.
//
// 공통 규칙
// - ID(job_id·pass_id·track_id·clip_id·asset_id·value_id)는 DB가 매기는 숫자(int64, JSON에서는 문자열 "128")다. 표마다 따로
//   세므로 같은 숫자라도 종류가 다르면 다른 것이다. 0은 "없음".
// - 시간은 모두 나노초 정수. 타임라인 시간축은 0 = 작업 시작 시각(job.started_at)이다.
// - 오류: 규칙에 안 맞는 값은 INVALID_ARGUMENT, 참조 중이라 못 지움·구간 겹침은 FAILED_PRECONDITION,
//   상태가 먼저 바뀜은 ABORTED, 없는 대상은 NOT_FOUND.
// 내부 설계: tacit docs/설계/엔티티.md §2~§5(외부 공개본에는 없어도 이 파일만으로 쓸 수 있게 적는다)
// ============================================================================
//
// 작성자: geosoft-Server
// 최초 작성: 2026-09-29
//
// 수정 이력:
//   2026-10-08  geosoft-Server: 라벨을 한 그루의 트리로 — 어휘(LabelVocab)를 없애고 상위가 없는 라벨이 맨 위 분류. ListLabelVocabs·CreateLabelVocab →
//                ListLabels, LabelValue.vocab_key·LabelRef.vocab_key 삭제, LabelValue.parent_value_id
//   2026-10-08  geosoft-Server: 클립 사이의 관계 — CLIP_KIND_RELATION·Clip.relation(관계 종류는 라벨 값). ClipProvenance.input_clip_ids 삭제
//   2026-10-07  geosoft-Server: track_id·clip_id·value_id·asset_id·run_id·tool_id를 숫자(int64)로 — ID는 모두 DB가 매기는 번호
//   2026-10-07  geosoft-Server: job_id·pass_id를 숫자(int64)로(다른 ID는 그대로 문자열)
//   2026-09-29  geosoft-Server: tacit-tag ProjectService·LayerDocumentService를 대체해 최초 정의
//                — Project(편집 공간) → Timeline(job 1:1), Layer → Track, LayerSegment → Clip,
//                  초(double)+unit → 나노초(int64), asset_ids[] → source 하나, label 문자열 →
//                  label_value_id, confidence·source·reviewed → provenance, SaveLayer(문서 통째
//                  교체)·revision CAS 삭제, GetProjectTree → GetTimeline
//   2026-09-29  geosoft-Server: label.v1 LabelService를 합침(레이어별 라벨 팔레트 → 전체 공통 어휘)
//   2026-09-29  geosoft-Server: TimelineService → MediaComposeService(서비스 역할 이름. 엔티티 이름은 Timeline 그대로)
//   2026-09-29  geosoft-Server: 패키지 mediatag.timeline.v1 → mediatag.compose.v1(서비스 이름에 맞춤)
//   2026-09-29  geosoft-Server: ClipKind REGION 추가(영상 속 영역은 locator 대신 region Asset)
//   2026-09-29  geosoft-Server: CreateClip·UpdateClip이 미첨부 Asset을 자동 첨부(FailedPrecondition 대신)
//   2026-09-29  geosoft-Server: timeline_id 삭제(job_id로 식별), CreateTimeline 삭제(처음 편집할 때 생성),
//                GetTimeline에 pass_id(패스 구간만 열기)
//   2026-09-30  geosoft-Server: ClipProvenance job_uuid·model_id·model_version → run_id·tool_id·tool_version
//   2026-09-30  geosoft-Server: 외부 공개 점검 — 주석에서 DB·내부 문서 의존 제거, 공통 규칙(ID 불투명·시간 단위·오류 코드),
//                Track.visible optional(비우면 true), Clip 구간 필수·트랙 이동은 같은 작업만
// ============================================================================

syntax = "proto3";

package mediatag.compose.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "mediatag/asset/v1/asset.proto";

option go_package = "gen/protobuf/mediatag/compose/v1;composev1";

service MediaComposeService {
  // 타임라인 + 전 트랙 + 클립(+ 클립이 가리키는 Asset)을 한 번에. 아직 편집 안 한 작업이면
  // 빈 draft 타임라인을 준다(행은 만들지 않음). pass_id를 주면 그 패스 구간과 겹치는 클립만 준다.
  rpc GetTimeline(GetTimelineRequest) returns (GetTimelineResponse);
  rpc ListTimelines(ListTimelinesRequest) returns (ListTimelinesResponse);
  // name, description, labels
  rpc UpdateTimeline(UpdateTimelineRequest) returns (UpdateTimelineResponse);
  // 현재 상태가 from_status일 때만 바꾼다. 아니면 Aborted(다른 요청이 먼저 바꿈).
  rpc ChangeTimelineStatus(ChangeTimelineStatusRequest) returns (ChangeTimelineStatusResponse);
  // 편집 초기화: 타임라인과 트랙·클립을 지운다(작업·첨부는 그대로).
  rpc DeleteTimeline(DeleteTimelineRequest) returns (DeleteTimelineResponse);

  rpc CreateTrack(CreateTrackRequest) returns (CreateTrackResponse);
  // name, order, visible
  rpc UpdateTrack(UpdateTrackRequest) returns (UpdateTrackResponse);
  // 트랙의 클립도 함께 지워진다.
  rpc DeleteTrack(DeleteTrackRequest) returns (DeleteTrackResponse);

  // 같은 트랙 클립과 구간이 겹치면 FailedPrecondition. source.asset_id가 이 작업에
  // 첨부되지 않았으면 같은 트랜잭션에서 작업 공용으로 첨부한다.
  rpc CreateClip(CreateClipRequest) returns (CreateClipResponse);
  // 오류 조건·자동 첨부는 CreateClip과 같다. 검수는 update_mask "provenance.reviewed".
  rpc UpdateClip(UpdateClipRequest) returns (UpdateClipResponse);
  rpc DeleteClip(DeleteClipRequest) returns (DeleteClipResponse);

  // 클립 사이의 관계(릴레이션)도 클립이다: CreateClip에 kind = RELATION, relation(from_clip_id·to_clip_id), 구간을 준다.
  // 관계 종류는 태그처럼 라벨 값(label_value_id)으로 고른다. 지우기·고치기도 DeleteClip·UpdateClip 그대로다.
}

// 라벨(통제 어휘). 모든 공사가 같이 쓴다. 지우지 않고 deprecated로 숨긴다.
service LabelService {
  // 라벨 전부. 라벨은 한 그루의 트리다: 상위가 없는 것(parent_value_id = 0)이 맨 위 분류(루트)이고 그 아래로 값이 달린다
  // (에셋 트리와 같은 모양). 평평한 목록으로 주니 parent_value_id로 엮는다. 수가 적어 페이지를 두지 않는다.
  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse);
  // 라벨을 만든다. name 필수. parent_value_id를 주면 그 아래에, 안 주면 맨 위 분류(루트)로 만든다.
  rpc CreateLabelValue(CreateLabelValueRequest) returns (CreateLabelValueResponse);
  // name·deprecated·description만 바꿀 수 있다. 이름을 바꿔도 Clip은 value_id로
  // 가리키므로 따로 갱신할 게 없다.
  rpc UpdateLabelValue(UpdateLabelValueRequest) returns (UpdateLabelValueResponse);
}

enum TimelineStatus {
  TIMELINE_STATUS_UNSPECIFIED = 0;
  TIMELINE_STATUS_DRAFT = 1;      // 작업 중(초기)
  TIMELINE_STATUS_SUGGESTED = 2;  // 검수 대기
  TIMELINE_STATUS_CONFIRMED = 3;  // 검수 완료 — 임베딩 대상
  TIMELINE_STATUS_REJECTED = 4;
}

// Clip이 무엇을 가리키는지(화면이 어떤 렌더러로 그릴지).
enum ClipKind {
  CLIP_KIND_UNSPECIFIED = 0;
  CLIP_KIND_VIDEO = 1;
  CLIP_KIND_AUDIO = 2;
  CLIP_KIND_IMAGE = 3;
  CLIP_KIND_PDF = 4;
  CLIP_KIND_SUBTITLE = 5;
  CLIP_KIND_POSE = 6;
  CLIP_KIND_TIMESERIES = 7;
  CLIP_KIND_POINTCLOUD = 8;
  CLIP_KIND_FILE = 9;   // 렌더러 없는 첨부(다운로드만)
  CLIP_KIND_TAG = 10;   // 분류 판단. source 없음, label 필수
  CLIP_KIND_REGION = 11; // 영상 속 영역. source = region Asset(프레임별 박스)
  CLIP_KIND_RELATION = 12; // 클립 사이의 관계. source 없음, relation 필수, label은 관계 종류(선택)
}

message LabelRef {
  reserved 1;      // 옛 vocab_key
  reserved "vocab_key";
  int64 value_id = 2;
}

message Timeline {
  int64 job_id = 1;        // 식별자. 작업과 1:1. 공사는 job.project_no
  string name = 2;
  TimelineStatus status = 3;
  string description = 4;
  repeated LabelRef labels = 5;                // 타임라인 전체에 붙는 분류. 실제 라벨 값만 받는다
  google.protobuf.Timestamp embedded_at = 6;   // 검색 색인 반영 시각. 현재 서버는 채우지 않음
  google.protobuf.Timestamp created_at = 7;    // 아직 행이 없으면 비어 있음
  google.protobuf.Timestamp updated_at = 8;
}

message Track {
  int64 track_id = 1;      // 서버 발급
  int64 job_id = 2;        // 어느 타임라인(= 작업)
  string name = 3;
  int32 order = 4;
  optional bool visible = 5; // 화면 표시 여부. 만들 때 비우면 true
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Clip {
  int64 clip_id = 1;       // 서버 발급
  int64 track_id = 2;      // 같은 작업의 트랙으로만 옮길 수 있다(다른 작업이면 INVALID_ARGUMENT)
  ClipKind kind = 3;
  // 타임라인 위 구간 [start, end), 필수. 같은 트랙의 Clip끼리 겹치면 FAILED_PRECONDITION
  optional int64 timeline_start_ns = 4;
  optional int64 timeline_end_ns = 5;
  ClipSource source = 6;    // kind=tag면 비어 있음
  int64 label_value_id = 7; // kind=tag면 필수. kind=relation이면 관계 종류(선택). 그 밖의 kind도 라벨을 붙일 수 있다
  string description = 8;
  ClipProvenance provenance = 9; // 있으면 도구가 만든 것(confidence가 있으면 검수 필요한 주장), 없으면 사람이 놓은 사실
  google.protobuf.Timestamp embedded_at = 10; // 검색 색인 반영 시각. 현재 서버는 채우지 않음
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  ClipRelation relation = 13; // kind=relation일 때만(필수). 그 밖의 kind에는 넣지 않는다
}

// 관계 클립이 잇는 두 클립. "이 구간(timeline_start_ns~end_ns)에서 from이 to와 관련 있다"는 뜻이다 — 구간은 관계 클립이
// 스스로 갖는다(from 클립의 구간 전체면 그 값을 그대로 넣는다). 방향이 있고, 대등한 관계는 화면이 방향을 무시한다.
// 두 클립은 관계 클립과 같은 작업의 것이어야 하고 서로 달라야 한다. 잇는 클립을 지우면 관계 클립도 지워진다.
// 관계 종류는 Clip.label_value_id(라벨, 선택) — 태그와 같은 라벨 트리를 쓴다. 관계 종류용 맨 위 분류를 LabelService로 하나 만든다.
message ClipRelation {
  int64 from_clip_id = 1;     // 만든 뒤에는 못 바꾼다
  int64 to_clip_id = 2;       // 만든 뒤에는 못 바꾼다
}

// 가리키는 Asset과 그 안의 범위. start/end·locator가 모두 비면 Asset 전체.
message ClipSource {
  int64 asset_id = 1;
  optional int64 start_ns = 2; // Asset 자신의 시간축
  optional int64 end_ns = 3;
  // kind별 위치(자유 형식 JSON). pdf: {"page": N}, image: {"x","y","width","height"}(0~1 비율),
  // pointcloud: {"points": [[x,y,z], ...]}. 영상 속 영역은 locator가 아니라 REGION Clip으로 둔다.
  google.protobuf.Struct locator = 4;
}

message ClipProvenance {
  optional double confidence = 1;
  bool reviewed = 2;          // 사람이 쓴다
  int64 run_id = 3;          // 만든 도구 실행 1건
  int64 tool_id = 4;
  string tool_version = 5;
  reserved 6; // 옛 input_clip_ids — 저장한 적이 없는 칸이다. 클립끼리 잇는 것은 관계 클립(kind=relation, Clip.relation)
  reserved "input_clip_ids";
}

message GetTimelineRequest {
  int64 job_id = 1;
  // 선택. 주면 그 패스 구간(pass.started_at~ended_at을 job.started_at 기준 ns로 바꾼 값)과
  // 겹치는 클립만 준다. 트랙은 전부 준다(빈 트랙도 행으로 보이게).
  int64 pass_id = 2;
  bool include_assets = 3;  // true면 클립이 가리키는 Asset 메타도(중복 제거)
}

message GetTimelineResponse {
  Timeline timeline = 1;
  repeated Track tracks = 2;   // order 순
  repeated Clip clips = 3;     // track_id, timeline_start_ns 순
  repeated mediatag.asset.v1.Asset assets = 4;
  // pass_id를 줬을 때 그 패스 구간(Timeline 시간축, [start, end)). 화면이 이 구간으로 확대해 연다.
  optional int64 window_start_ns = 5;
  optional int64 window_end_ns = 6;
}

message ListTimelinesRequest {
  string project_no = 1;       // 선택
  TimelineStatus status = 2;   // UNSPECIFIED면 전체
  int32 page_size = 3;
  string page_token = 4;
}

message ListTimelinesResponse {
  repeated Timeline timelines = 1;
  string next_page_token = 2;
}

message UpdateTimelineRequest {
  Timeline timeline = 1;
  google.protobuf.FieldMask update_mask = 2; // name, description, labels
}

message UpdateTimelineResponse {
  Timeline timeline = 1;
}

message ChangeTimelineStatusRequest {
  int64 job_id = 1;
  TimelineStatus from_status = 2;
  TimelineStatus to_status = 3;
}

message ChangeTimelineStatusResponse {
  Timeline timeline = 1;
}

message DeleteTimelineRequest {
  int64 job_id = 1;
}

message DeleteTimelineResponse {}

message CreateTrackRequest {
  Track track = 1;          // track_id는 서버 발급
}

message CreateTrackResponse {
  Track track = 1;
}

message UpdateTrackRequest {
  Track track = 1;
  google.protobuf.FieldMask update_mask = 2; // name, order, visible
}

message UpdateTrackResponse {
  Track track = 1;
}

message DeleteTrackRequest {
  int64 track_id = 1;
}

message DeleteTrackResponse {}

message CreateClipRequest {
  Clip clip = 1;            // clip_id는 서버 발급. provenance는 무시(사람이 놓는 Clip)
}

message CreateClipResponse {
  Clip clip = 1;
}

message UpdateClipRequest {
  Clip clip = 1;
  // track_id, timeline_start_ns, timeline_end_ns, source, label_value_id, description,
  // provenance.reviewed
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateClipResponse {
  Clip clip = 1;
}

message DeleteClipRequest {
  int64 clip_id = 1;
}

message DeleteClipResponse {}

// ===== 라벨 =====

// 라벨 하나. 맨 위 분류(루트)도 그 아래 값도 같은 모양이다. 찾을 때는 value_id로 찾는다 — 이름은 사람이 보는 값이다.
message LabelValue {
  int64 value_id = 1;          // 서버 발급
  reserved 2;                   // 옛 vocab_key — 어휘 표를 없앴다. 맨 위 분류는 상위가 없는 라벨이다
  reserved "vocab_key";
  string name = 3;
  bool deprecated = 4;          // true면 표시 제외
  string description = 5;
  int64 parent_value_id = 6;    // 상위 라벨. 0이면 맨 위 분류(루트). 만든 뒤에는 못 바꾼다
}

message ListLabelsRequest {
  bool include_deprecated = 1;
}

message ListLabelsResponse {
  repeated LabelValue labels = 1; // value_id 순
}

message CreateLabelValueRequest {
  reserved 1;                   // 옛 vocab_key
  reserved "vocab_key";
  string name = 2;
  string description = 3;
  int64 parent_value_id = 4;    // 선택. 그 라벨 아래에 단다. 비우면 맨 위 분류(루트)
}

message CreateLabelValueResponse {
  LabelValue value = 1;
}

message UpdateLabelValueRequest {
  LabelValue value = 1;                    // value.value_id 필수
  google.protobuf.FieldMask update_mask = 2; // name, deprecated, description
}

message UpdateLabelValueResponse {
  LabelValue value = 1;
}
