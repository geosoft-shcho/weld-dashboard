<title>공사 관리 화면안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 용접 수집 대시보드(tks.faivv.ai)와 같은 껍데기 — 위 제목줄, 왼쪽 아이콘 줄, 필터 패널 + 표.
   첫 화면은 뷰포트 높이에 맞춘 예시 화면(안에서만 스크롤), 그 아래로 탭별 규칙·RPC 정리. 대시보드가 어두운 화면이라 어두운 한 가지 테마로 둔다 */
:root{
  --bg:#17181b; --bar:#1c1d20; --panel:#25272b; --panel2:#2c2f34; --line:#373a40; --fg:#e6e8eb; --muted:#9aa0a8;
  --btn:#c9d8ee; --btn-fg:#1b2a40; --accent:#8fb4e3; --ok:#5fb37c; --warn:#d6a24a; --danger:#e07a70; --row:#2a2d32;
  --sans:"IBM Plex Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important} /* .ov{display:grid} 같은 규칙이 hidden을 이기지 않게 — 게시 껍데기에 기대지 않는다 */
html,body{background:var(--bg);color:var(--fg)}
body{font:13px/1.5 var(--sans)}
.app{display:grid;grid-template-columns:48px minmax(0,1fr);grid-template-rows:46px auto;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:600px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding-inline:16px;background:var(--bar);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .upd{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.rail{background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:10px}
.rail i{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--muted);font-style:normal;font-size:14px}
.rail i.on{background:var(--panel2);color:var(--fg);box-shadow:-10px 0 0 -7px var(--fg)}
.work{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding:10px 16px 12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:0;background:none;color:var(--muted);padding:7px 16px;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:500}
.filters{background:var(--panel);border-radius:4px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.filters label{display:grid;gap:3px;font-size:12px;color:var(--fg)}
.filters .sp{margin-left:auto;display:flex;gap:6px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:10px;min-height:0}
.split.p{grid-template-columns:minmax(0,1fr) minmax(360px,1.1fr)}
.box{background:var(--panel);border-radius:4px;min-width:0;min-height:0;display:flex;flex-direction:column}
.bh{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bh h2{font-size:13px;margin:0;font-weight:600}
.bh .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.scroll{overflow:auto;min-height:0;flex:1}
.pad{padding:12px;display:grid;gap:12px;align-content:start;grid-auto-rows:max-content}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:4px 11px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-fg);font-weight:500}
button.dg{color:var(--danger)}
button.dg.solid{background:var(--danger);border-color:var(--danger);color:var(--bg)}
button.lk{border:0;background:none;color:var(--accent);padding:1px 4px}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:4px 8px;min-width:0}
input[readonly]{color:var(--muted);background:var(--bar)}
input.code{font-family:var(--mono);text-transform:uppercase}
input.bad,select.bad{border-color:var(--danger)}
select{min-width:120px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--panel2);font-size:12px;font-weight:600;text-align:left;padding:7px 10px;white-space:nowrap;z-index:1}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody.pick tr{cursor:pointer}
tbody.pick tr:hover{background:var(--row)}
tbody.pick tr.sel{background:var(--row);box-shadow:inset 3px 0 0 var(--accent)}
.mono{font-family:var(--mono);font-size:12px}
.mut{color:var(--muted)}
.sm{font-size:12px}
.chip{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;background:var(--panel2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.chip.w{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chip.o{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.chip.a{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.f{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.f b{color:var(--fg);font-weight:500}
.f .req{color:var(--danger)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px}
.kv div{min-width:0;overflow-wrap:anywhere}
.kv .mut{font-size:11px}
.err{color:var(--danger);font-size:12px}
.hint{color:var(--muted);font-size:11px}
.note{border-radius:3px;padding:7px 10px;font-size:12px;border:1px solid var(--line)}
.note.w{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.note.d{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.sub{display:flex;gap:2px;border-bottom:1px solid var(--line);padding-inline:12px}
.sub button{border:0;border-radius:0;background:none;color:var(--muted);padding:6px 10px;border-bottom:2px solid transparent;margin-bottom:-1px}
.sub button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.unit{border:1px solid var(--line);border-radius:3px}
.unit>summary{list-style:none;cursor:pointer;padding:6px 10px;display:flex;gap:8px;font-weight:500}
.unit>summary::-webkit-details-marker{display:none}
.unit>summary::before{content:"▸";color:var(--muted)}
.unit[open]>summary::before{content:"▾"}
.unit>summary span:first-of-type{flex:1}
.irow{display:grid;grid-template-columns:60px 90px minmax(0,1fr) auto;gap:6px;align-items:center;padding:4px 10px;border-top:1px solid var(--line)}
.irow.new{background:var(--panel2)}
.irow.hit{box-shadow:inset 3px 0 0 var(--warn)}
.prow{display:grid;grid-template-columns:60px minmax(0,1fr) minmax(0,1fr) 24px;gap:6px;align-items:center;padding:4px 10px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.new{background:var(--panel2)}
.chip.nw{color:var(--btn-fg);background:var(--btn);border-color:var(--btn)}
.cmp th{position:static;background:none;color:var(--muted);font-weight:500;width:110px}
.cmp td{font-size:12px;overflow-wrap:anywhere;min-width:150px}
.cmp td.df{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.cmp thead td{font-weight:600}
.cmp tr.keep td.k{box-shadow:inset 0 2px 0 var(--accent)}
.pv{background:var(--bar);border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;position:relative;color:var(--muted);overflow:hidden;font-size:11px;min-height:64px}
.pv .play{font-size:22px;color:var(--fg);opacity:.8}
.pv .pvl{position:absolute;left:6px;bottom:4px;font-family:var(--mono);font-size:10.5px}
.pv svg{width:100%;height:100%;display:block}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:12px}
.dl dt{color:var(--muted)}.dl dd{margin:0;overflow-wrap:anywhere}
.chk,.filters label.chk{display:flex;gap:6px;align-items:center;font-size:12px}
.log{height:96px;overflow:auto;background:var(--panel);border-radius:4px;font:11.5px/1.45 var(--mono);padding:6px 12px;display:grid;gap:4px;align-content:start}
.log .h{font-family:var(--sans);font-size:12px;font-weight:600;display:flex;gap:8px;position:sticky;top:-6px;background:var(--panel);padding-block:2px}
.log div.e{white-space:pre-wrap;word-break:break-all;border-left:2px solid var(--line);padding-left:8px}
.log .m{color:var(--accent)}
.log .x{color:var(--danger)}
.tree{display:inline-block;width:16px;color:var(--muted)}
.child td:first-child{padding-left:28px}
.ov{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);display:grid;place-items:center;padding:16px;z-index:5}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:6px;max-width:460px;width:100%;padding:16px;display:grid;gap:10px;max-height:90vh;overflow:auto}
.dlg.wide{max-width:640px}
.dlg h3{margin:0;font-size:15px}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.steps{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.steps span+span::before{content:"→";color:var(--muted);margin-right:4px}
/* 아래: 규칙·RPC */
.doc{padding:28px 16px 48px;max-width:1180px;margin:0 auto;display:grid;gap:20px}
.doc h2{font-size:16px;margin:0;text-wrap:balance}
.doc h3{font-size:14px;margin:0}
.doc section{display:grid;gap:10px}
.doc ul{margin:0;padding-left:18px;display:grid;gap:4px;max-width:90ch;color:var(--muted)}
.doc ul b{color:var(--fg);font-weight:500}
.doc .tw{overflow-x:auto;background:var(--panel);border-radius:4px}
.doc td{vertical-align:top}
.doc th{position:static}
.rpc{font:12px var(--mono);color:var(--accent);white-space:nowrap}
.doc pre{background:var(--panel);border-radius:4px;padding:10px 12px;overflow-x:auto;font:12px/1.5 var(--mono);margin:0}
@media (max-width:900px){
  .app{height:auto;grid-template-rows:46px auto}
  .split,.split.p{grid-template-columns:minmax(0,1fr)}
  .box{max-height:70vh}
  .rail{display:none}.app{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){button,tbody.pick tr{transition:background .1s,border-color .1s}}
</style>

  <div class="top"><span class="mut" aria-hidden="true">☰</span><h1>용접 수집 대시보드 : <span id="ttl">공사 관리</span></h1><span class="upd">화면안 · 예시 데이터(운영 DB 일부) · 서버와 연결 안 됨 · 2026-10-19</span></div>

</div>

 '<span class="mono">job_id</span>는 바뀌지 않습니다. 공사 · 호기 · 품목 · 이음부 · 시작을 고치면 공통키와 작업 키가 다시 만들어지니 응답의 Job으로 화면을 갱신합니다.',
 '품목을 바꾸면 그 작업은 새 품목의 성적서를 봅니다. 옛 품목의 잘라 낸 PDF 첨부는 남으니 필요하면 뗍니다.',
 '<b>패스는 작업 구간 안</b>(<span class="rpc">InvalidArgument</span>), <b>서로 겹치면 안 됨</b>(<span class="rpc">FailedPrecondition</span>). 끝과 시작이 맞닿는 건 됩니다. 시각이 빈 패스는 겹침 검사를 하지 않습니다.',
 '작업 구간을 줄여 패스가 밖으로 나가면 <span class="rpc">InvalidArgument</span>. 패스를 먼저 고칩니다.',
 '패스를 지우면 그 패스의 첨부는 작업 공용이 됩니다.',
 '<b>작업 지우기</b>는 첨부 · 타임라인 · 직접 매칭한 성적서 세트가 있으면 <span class="rpc">FailedPrecondition</span>. 먼저 떼거나 지웁니다. 패스는 함께 지워집니다.',
 '같은 품목 · 이음부 · 날짜로 두 번 만들면 작업이 둘 생깁니다(재작업).'],

asset:{rules:['<b>metadata 파트가 file보다 먼저</b> 와야 합니다(FormData에 넣는 순서).',
 '<b>종류는 서버가 파일 내용으로 정합니다.</b> 확장자는 파일 선택 창 안내용입니다. 표에 없는 파일은 종류 없이 등록만 되고, 실행 파일은 400.',
 '<b>시간 자료(영상 · 음성 · 깊이 원본 · 센서 · 포즈)는 timeOrigin이 필수</b>입니다. 그 파일의 시간 0이 가리키는 절대 시각(RFC 3339).',
 '<b>센서 · 포즈의 프로필은 고르지 않습니다.</b> 서버가 머리행의 시간 열로 정합니다(<span class="mono">절대시각_epoch</span> · <span class="mono">bag_time_ns</span> · <span class="mono">구간초</span> · <span class="mono">t_abs</span>). 넷 다 없으면 종류 없이 등록만 되고 후처리가 안 걸립니다(<span class="mono">asset.kind</span> 빔, <span class="mono">runId</span> 없음) — 화면은 “시간 열을 못 찾아 등록만 됨”과 지원하는 열을 보입니다.',
 'jobId 없이 올리면 작업 미지정 에셋이 됩니다. 나중에 작업 탭의 “에셋 붙이기”(<span class="rpc">AttachAsset</span>)로 붙입니다.',
 '올리면 후처리(asset-postprocess)가 큐에 들어갑니다. 응답의 runId로 <span class="rpc">GetRun</span>을 불러 진행을 보고, 끝나면 타임라인을 다시 불러옵니다.',
 '<b>첨부와 배치는 다릅니다.</b> 첨부는 “이 작업의 자료” 표시이고, 타임라인 배치는 후처리나 CreateClip이 합니다.',
 '<b>지우기는 되돌릴 수 없습니다.</b> 첨부 · 파생 부모 · 성적서 원본이면 <span class="rpc">FailedPrecondition</span>.',
 '같은 파일을 다시 올리면 새 에셋이 됩니다. 중복은 <span class="rpc">ListDuplicateAssets</span>로 찾아 사람이 정리합니다.',
 '끊기면 처음부터 다시 올립니다(이어받기 없음). 한도는 ListUploadFormats의 max_bytes(기본 8GiB), 넘으면 413.',
 '상세의 <b>붙은 작업</b>은 <span class="rpc">ListJobs(asset_id)</span>(10-19 추가)로 읽습니다. 직접 첨부된 작업만 나옵니다.',
 '<b>중복:</b> sha256이 같아도 같은 에셋은 아닙니다. <b>합칠 수 있는 것</b> = sha256 · 종류 · 기록 시각 · 장비(한쪽이 비면 같다고 봄) · 만든 경위(부모 · 작업 · 매개변수)가 같고, 성적서 세트 · 파생이 둘 이상의 사본에 있지 않은 것. 못 합치면 이유를 보여 줍니다.',
 '<b>에셋 정보는 서버가 준 표시 목록(<span class="mono">Asset.display</span>, 10-19 추가)을 그대로 그립니다.</b> 종류마다 속성 키가 다르고(영상: 해상도 · fps · 코덱 · 첫 프레임 시각 · 소리 / 센서 · 포즈: 채널 · 샘플 Hz · 시간 기준 / 깊이: 해상도 · 단위 / 문서: 쪽 수) 빠진 값도 있어, 화면이 키를 해석하지 않게 합니다. 원래 <span class="mono">properties</span>는 접어 둡니다.',
 '<b>미리 보기는 화면이 kind로 고릅니다</b>: 영상 · 음성은 플레이어, 이미지는 그림, 문서는 PDF 첫 쪽, 센서는 앞 채널 몇 개의 파형, 포즈는 관절 그림, 깊이 원본은 재생 불가 안내. 파일은 <span class="mono">content_url</span>로 엽니다.',
 '<b>비교 화면:</b> 사본을 열로 놓고 파일 이름 · 크기 · 기록 시각 · 장비 · 원본 위치 · 만든 경위 · 붙은 작업 · 클립 · 파생 · 성적서 세트를 줄로 비교, 다른 칸은 강조. 남길 것은 기본으로 참조가 가장 많은 것(같으면 번호가 작은 것).',
 '<b>미리 보기는 사본을 바꿔 가며</b>(하나씩: 탭 · ◀ ▶로 크게) <b>또는 나란히</b> 봅니다. 각 사본의 실제 파일을 content_url로 엽니다.',
 '<b>정리는 둘 중 하나:</b> ① 기준을 고르고 <b>합치기</b> — 확인 창에 <span class="rpc">MergeAssets(dry_run)</span> 결과(옮겨질 첨부 · 클립 · 파생 · 성적서 수)를 보여 주고 확인하면 실행. ② <b>그대로 두기</b>(<span class="rpc">ResolveDuplicateGroup</span>, 10-19 추가) — 중복이 아니라고 기록해 목록에서 뺍니다.',
 '<b>정리한 묶음에 같은 내용이 또 들어오면 다시 뜹니다.</b> 서버는 결정 때의 사본 번호를 기억해, 그 밖의 사본이 생기면 “새 사본”으로 표시합니다. 합친 묶음이면 기준 번호를 함께 주어 바로 그 기준에 합칠 수 있습니다. 올릴 때 응답 warnings · duplicateOf에도 기준 번호가 옵니다.',
 '기록 시각만 다른 사본(예시 데이터 394묶음)은 기본 목록에서 빠집니다(<span class="mono">include_time_shifted</span>로 볼 수 있음).',
 '올린 파일과 같은 내용이 있으면 응답 <span class="mono">warnings</span>와 <span class="mono">duplicateOf</span>로 알려 줍니다. 등록은 막지 않습니다.',
 '<b>작업 필터</b>를 고르면 <span class="rpc">ListAssets</span> 대신 <span class="rpc">ListJobAssets(job_id, pass_id)</span>를 부릅니다(서버 수정 없음). 작업 하나의 첨부는 많아야 수백 건이라 한 번에 받고 종류 · 이름 · 장비는 화면에서 거릅니다. 작업 미지정만은 끕니다. 작업 칸은 공사 → 호기 → 품목 → 이음부 → 작업 순으로 좁힙니다.',
 '<b>작업 필터에서도 계층을 봅니다</b> — 받은 목록은 계층이 없어 화면이 짭니다. ① 부모가 같은 목록에 있으면 그 아래로(포즈 · STT). ② 부모가 없으면 맨 위 줄로 두고 “원본 n(이 작업에 첨부 안 됨)” 링크(잘라 낸 PDF · 표준화본 — 부모는 어느 작업에도 안 붙어 있다). ③ <span class="mono">child_count</span>가 목록 안 자식 수보다 크면 펼칠 때 <span class="rpc">ListAssets(parent_asset_id)</span>로 받아 이미 있는 행은 빼고 “첨부 안 된 파생”으로 보입니다.'],

worker:{rules:['<b>목록은 화면에서 거릅니다.</b> 작업자가 몇 명뿐이라(운영 DB 8명) <span class="rpc">ListWorkers(include_inactive = true)</span>로 다 받아 이름 · 사번 · 비고 · 종류로 거릅니다. 수백 명이 넘으면 그때 서버 필터를 더합니다.',
 '<b>종류는 넷입니다</b> — 명장(<span class="mono">WORKER_TYPE_MASTER</span>) · 일반(<span class="mono">GENERAL</span>) · 로봇(<span class="mono">ROBOT</span>) · 모름(<span class="mono">UNSPECIFIED</span>). 모름으로 바꿀 때는 update_mask에 worker_type을 넣고 UNSPECIFIED를 보냅니다.',
 '명장은 파형 비교의 “명장만”(<span class="mono">ListJobs.worker_type = MASTER</span>)이 씁니다.',
 '<b>사번</b>은 비워도 되고, 있으면 겹칠 수 없습니다(<span class="rpc">AlreadyExists</span>). 이름이 같은 사람을 가르는 값입니다.',
 '<b>숨김</b>(<span class="mono">inactive</span>)은 그만둔 사람용입니다. 작업 탭 등 <b>고르는 목록에서만</b> 빠지고(ListWorkers 기본), 맡은 작업에는 그대로 보입니다. 이 탭은 “숨긴 작업자도”를 켜면 함께 보입니다.',
 '이름을 고치면 그 작업자의 모든 작업에 바뀐 이름이 보입니다(작업은 번호로 가리킴).',
 '같은 이름을 서버는 막지 않습니다. 만들 때 화면이 한 번 알립니다.',
 '<b>맡은 작업이 있으면 지울 수 없습니다</b>(<span class="rpc">FailedPrecondition</span>). 화면은 작업 수로 먼저 막습니다 — 그만둔 사람은 지우지 말고 숨깁니다.',
 '작업자 없는 작업은 이 탭에 안 보입니다. ListJobs에 “작업자 미지정” 필터는 없습니다.',

equipment:{rules:['<b>목록은 화면에서 거릅니다.</b> 장비가 몇 대뿐이라(운영 DB 4대) <span class="rpc">ListEquipment(include_inactive = true)</span>로 다 받아 코드 · 이름 · 라인 · 비고로 거릅니다.',
 '<b>숨김</b>(<span class="mono">inactive</span>)은 안 쓰는 장비용입니다. 올리기 창 등 고르는 목록(ListEquipment 기본)에서만 빠지고, 기록한 에셋에는 그대로 보입니다. 에셋이 있어 못 지우는 장비는 숨깁니다.',
 '<b>장비 코드는 적재기가 장비를 찾는 열쇠입니다.</b> 적재기는 코드로 장비를 찾고, 없으면 그 코드로 장비를 새로 만듭니다. 코드를 바꾸면 다음 적재 때 같은 장비가 둘이 되므로, 코드 칸은 [코드 바꾸기]를 눌러야 열립니다.',
 '코드는 비워도 됩니다(손으로만 고르는 장비). 있으면 유일해야 하고, 겹치면 <span class="rpc">AlreadyExists</span>. 공백 없이 대문자로 보냅니다.',
 '<b>기록한 에셋이 있으면 지울 수 없습니다</b>(<span class="rpc">FailedPrecondition</span>). 화면은 <span class="mono">equipment_asset_counts</span>가 0일 때만 [지우기]를 엽니다. 운영 DB의 4대는 모두 에셋이 있습니다.',

  'a-pv':()=>{sa.pv=sa.pv==='side'?'tab':'side';render()},
  'a-merge':()=>{const g=dups.find(x=>x.sha.startsWith(sa.g)),it=g.items,k=keepOf(g),K0=it.find(x=>x.id===k),m=it.filter(x=>x!==K0);
    const c={attachments:m.reduce((n,x)=>n+x.jobs.length,0),clips:m.reduce((n,x)=>n+(x.clips||0),0),children:m.reduce((n,x)=>n+x.children,0),report_refs:m.reduce((n,x)=>n+x.sets,0),tool_runs:0};
    log('MergeAssets',{keep_asset_id:k,merge_asset_ids:m.map(x=>x.id),dry_run:true},'moved: '+JSON.stringify(c)+' (10-19 추가)');
    dialog(`<h3>${m.map(x=>x.id).join(', ')}을(를) 기준 ${k}에 합칠까요?</h3><div class="note">첨부 ${c.attachments} · 클립 ${c.clips} · 파생 ${c.children} · 성적서 참조 ${c.report_refs} · 도구 실행 ${c.tool_runs}이(가) ${k}(으)로 옮겨집니다. <span class="mono mut">dry_run 결과</span></div>
      <div class="note d">사본 행과 파일이 지워집니다. 되돌릴 수 없습니다.</div><div class="acts"><button data-x>취소</button><button class="dg solid" data-ok>합치기</button></div>`,
    ()=>{m.forEach(x=>x.jobs.forEach(j=>{if(!K0.jobs.includes(j))K0.jobs.push(j)}));g.items=[K0];res[g.sha]={decision:'merged',keep:k,members:[k],at:new Date(Date.now()+9*36e5).toISOString().slice(0,19)};
      log('MergeAssets',{keep_asset_id:k,merge_asset_ids:m.map(x=>x.id)},'deleted_asset_ids: ['+m.map(x=>x.id)+'] · 결정 기록(merged) (10-19 추가)');render()})},
  'a-sep':()=>{const g=dups.find(x=>x.sha.startsWith(sa.g))||dups[0];dialog(`<h3>이 묶음을 그대로 둘까요?</h3><div class="note">중복 목록에서 빠집니다. 지금 사본 ${g.items.length}개(${g.items.map(x=>x.id).join(', ')})를 기록해 두고, 같은 내용의 파일이 새로 들어오면 다시 뜹니다. “정리한 묶음도 보기”로 언제든 다시 볼 수 있습니다.</div><div class="acts"><button data-x>취소</button><button class="pri" data-ok>그대로 두기</button></div>`,
    ()=>{res[g.sha]={decision:'keep_separate',keep:keepOf(g),members:g.items.map(x=>x.id),at:new Date(Date.now()+9*36e5).toISOString().slice(0,19)};log('ResolveDuplicateGroup',{sha256:g.sha,member_asset_ids:res[g.sha].members,keep_asset_id:res[g.sha].keep},'본 사본이 지금과 다르면 FailedPrecondition');render()})},
  'a-newcopy':()=>{const g=dups.find(x=>x.sha.startsWith(sa.g)),b0=g.items[0],n={...b0,id:id(),jobs:[],sets:0,children:0,clips:0,src:'',file:b0.file};g.items.push(n);
    log('POST /assets',{metadata:{},file:n.file},`201 · asset ${n.id} · warnings: "같은 내용의 에셋 ${res[g.sha].keep}가 있음 — ${res[g.sha].decision==='merged'?'합친 묶음의 기준':'그대로 두기로 한 묶음'}", duplicateOf:[${res[g.sha].keep}]`);sa.g=g.sha.slice(0,8);render()},
  'a-del':()=>{const why=[as.children.length&&'파생의 부모',!as.unattached&&'작업 첨부',as.report&&'성적서 원본'].filter(Boolean);
    if(why.length){log('DeleteAsset',{asset_id:as.id},'FailedPrecondition ('+why.join(' · ')+')');return dialog(`<h3>이 에셋은 지울 수 없습니다</h3><div class="note d">${why.join(' · ')}입니다. 먼저 떼거나 파생을 지우세요.</div><div class="acts"><button data-x>닫기</button></div>`)}
    dialog(`<h3>에셋 ${as.id}를 지울까요?</h3><div class="note d">행과 저장된 파일이 지워집니다. 되돌릴 수 없습니다.</div><div class="acts"><button data-x>취소</button><button class="dg solid" data-ok>지우기</button></div>`,
    ()=>{assets.splice(assets.indexOf(as),1);if(as.parent)AS(as.parent).children=AS(as.parent).children.filter(c=>c!==as.id);log('DeleteAsset',{asset_id:as.id});sa.sel=assets[0]?.id;render()})},
  }[a]||(()=>{}))();
});
document.addEventListener('change',e=>{const t=e.target,sj=st.job;
  // 첨부의 패스 바꾸기 = 같은 작업 · 에셋으로 AttachAsset 다시(이미 붙어 있으면 pass_id만 고침). 0 = 작업 공용
  if(t.matches('.at-pass')){const x=attach[sj.sel].find(q=>q.asset===+t.dataset.x);x.pass=+t.value;log('AttachAsset',{job_id:sj.sel,asset_id:x.asset,pass_id:x.pass},'이미 붙어 있어 pass_id만 고침');render()}
  if(t.id==='jf-proj'){Object.assign(sj,{proj:t.value,unit:'',code:''});render()}
  if(t.id==='jf-unit'){sj.unit=t.value;sj.code='';render()}
  if(t.id==='jf-code'){sj.code=t.value;render()}
  if(t.id==='jf-worker'){sj.worker=t.value;render()}
  if(t.id==='pf-empty'){st.project.empty=t.checked;render()}
  if(t.id==='wf-kind'){st.worker.kind=t.value;render()}
  if(t.id==='wf-hidden'){st.worker.hidden=t.checked;log('ListWorkers',{include_inactive:t.checked});render()}
  if(t.id==='ef-hidden'){st.equipment.hidden=t.checked;log('ListEquipment',{include_inactive:t.checked});render()}
  if(t.id==='ef-line'){st.equipment.line=t.value;render()}
  if(t.id==='af-kind'){st.asset.kind=t.value;render()}
  if(t.id==='af-q'){st.asset.q=t.value.trim();render()}
  if(t.id==='af-eq'){st.asset.eq=t.value;render()}
  if(t.id==='af-un'){st.asset.un=t.checked;render()}
  if(t.id==='af-job'){Object.assign(st.asset,{job:t.value,pass:'',un:false,open:{}});if(t.value)log('ListJobAssets',{job_id:+t.value});render()}
  if(t.id==='af-pass'){st.asset.pass=t.value;log('ListJobAssets',{job_id:+st.asset.job,...(t.value!==''&&{pass_id:+t.value})},t.value==='0'?'pass_id 0 = 작업 공용만':'');render()}
  if(t.id==='af-res'){st.asset.showRes=t.checked;log('ListDuplicateAssets',{page_size:50,include_resolved:t.checked});render()}
  if(t.id==='af-shift'){st.asset.shifted=t.checked;log('ListDuplicateAssets',{page_size:50,include_time_shifted:t.checked});render()}
});
// 검색 칸은 칠 때마다 표만 다시 그린다(필터 패널을 다시 그리면 입력 칸 포커스가 빠진다)
document.addEventListener('input',e=>{const k={'pf-q':'project','wf-q':'worker','ef-q':'equipment'}[e.target.id];if(k){st[k].q=e.target.value;$('#screen').innerHTML=VIEW[k][1]()}});
document.addEventListener('submit',e=>{e.preventDefault();const sp=st.project,f=e.target.id;
  if(f==='f-w'){const sw=st.worker,old=W(+e.target.dataset.id),v={worker_name:$('#wk-name').value.trim(),worker_type:$('#wk-t').value,employee_no:$('#wk-emp').value.trim(),description:$('#wk-desc').value.trim(),inactive:$('#wk-hid').checked},er=m=>$('#wk-err').textContent=m;
    if(!v.worker_name){$('#wk-name').classList.add('bad');return er('이름을 넣으세요.')}
    const send=x=>({...x,...('worker_type' in x&&{worker_type:WT(x.worker_type)})});
    if(v.employee_no&&workers.some(x=>x!==old&&x.emp===v.employee_no)){$('#wk-eerr').textContent=v.employee_no+'는 이미 있는 사번입니다.';log(old?'UpdateWorker':'CreateWorker',{worker:{employee_no:v.employee_no}},'AlreadyExists');return}
    if(!old){if(!sw.dupOk&&workers.some(x=>x.name===v.worker_name)){sw.dupOk=true;return er('같은 이름의 작업자가 있습니다. 다른 사람이면 [만들기]를 한 번 더 누르세요(사번으로 가를 수 있습니다).')}
      const n={id:id(),name:v.worker_name,type:v.worker_type,emp:v.employee_no,desc:v.description,hidden:v.inactive,jobs:0};workers.push(n);log('CreateWorker',{worker:send(v)});Object.assign(sw,{sel:n.id,mode:'view',dupOk:false});return render()}
    const ov={worker_name:old.name,worker_type:old.type,employee_no:old.emp||'',description:old.desc||'',inactive:old.hidden},m=Object.keys(v).filter(k=>v[k]!==ov[k]);if(!m.length)return er('바뀐 칸이 없습니다.');
    Object.assign(old,{name:v.worker_name,type:v.worker_type,emp:v.employee_no,desc:v.description,hidden:v.inactive});log('UpdateWorker',{worker:send({worker_id:old.id,...Object.fromEntries(m.map(k=>[k,v[k]]))}),update_mask:{paths:m}},m.includes('worker_type')&&!v.worker_type?'WORKER_TYPE_UNSPECIFIED → 모름':'');sw.mode='view';return render()}
  if(f==='f-e'){const se=st.equipment,old=E(+e.target.dataset.id),v={equipment_name:$('#eq-name').value.trim(),line_name:$('#eq-line').value.trim(),equipment_code:normCode($('#eq-code').value),description:$('#eq-desc').value.trim(),inactive:$('#eq-hid').checked},er=m=>$('#eq-err').textContent=m;
    if(!v.equipment_name){$('#eq-name').classList.add('bad');return er('이름을 넣으세요.')}
    if(v.equipment_code&&equipment.some(x=>x!==old&&x.code===v.equipment_code)){$('#eq-cerr').textContent=v.equipment_code+'는 이미 있는 장비 코드입니다.';log(old?'UpdateEquipment':'CreateEquipment',{equipment:{equipment_code:v.equipment_code}},'AlreadyExists');return}
    if(!old){const n={id:id(),name:v.equipment_name,line:v.line_name,code:v.equipment_code,desc:v.description,hidden:v.inactive,jobs:0,assets:0};equipment.push(n);log('CreateEquipment',{equipment:v});Object.assign(se,{sel:n.id,mode:'view'});return render()}
    const ov={equipment_name:old.name,line_name:old.line||'',equipment_code:old.code||'',description:old.desc||'',inactive:old.hidden},m=Object.keys(v).filter(k=>v[k]!==ov[k]);if(!m.length)return er('바뀐 칸이 없습니다.');
    Object.assign(old,{name:v.equipment_name,line:v.line_name,code:v.equipment_code,desc:v.description,hidden:v.inactive});log('UpdateEquipment',{equipment:{equipment_id:old.id,...Object.fromEntries(m.map(k=>[k,v[k]]))},update_mask:{paths:m}},m.includes('equipment_code')?'코드가 바뀜 — 적재 설정도 바꿀 것':'');Object.assign(se,{mode:'view',codeOpen:false});return render()}
  if(f==='f-pnew'){const d=sp.draft;readRows(d.items);const no=normCode($('#pn-no').value),err=$('#pn-err');err.textContent='';
    if(!no){err.textContent='공사 번호를 넣으세요.';return}
    if(projects.some(p=>p.no===no)){err.textContent=no+'는 이미 있는 공사 번호입니다.';log('CreateProject',{project:{project_no:no}},'AlreadyExists');return}
    const er=d.items.length?checkRows(d.items):'';if(er){$('#pi-err').textContent=er;return}
    const p={id:id(),no,name:$('#pn-name').value.trim(),site:$('#pn-site').value.trim(),customer:$('#pn-cust').value.trim(),jobs:0,items:[]};projects.push(p);
    log('CreateProject',{project:{project_no:p.no,project_name:p.name,site_name:p.site,customer:p.customer}});
    if(d.items.length){assign(p,d.items);log('CreateProjectItems',{project_id:p.id,items:d.items.map(r=>({unit_no:r.unit,item_code:r.code,item_name:r.name}))},'project_id는 CreateProject 응답 값')}
    Object.assign(sp,{sel:p.id,mode:'view',draft:null});render()}
  if(f==='f-pedit'){const p=P(sp.sel),nv={project_name:$('#pe-name').value.trim(),site_name:$('#pe-site').value.trim(),customer:$('#pe-cust').value.trim()},old={project_name:p.name,site_name:p.site,customer:p.customer},m=Object.keys(nv).filter(k=>nv[k]!==old[k]);
    if(m.length){Object.assign(p,{name:nv.project_name,site:nv.site_name,customer:nv.customer});log('UpdateProject',{project:{project_id:p.id,...Object.fromEntries(m.map(k=>[k,nv[k]]))},update_mask:{paths:m}})}
    sp.mode='view';render()}
  if(f==='f-jedit'){const j=jobs.find(x=>x.id===st.job.sel),v={project_id:+$('#je-proj').value,unit_no:normUnit($('#je-unit').value),item_code:normCode($('#je-code').value),joint_no:normCode($('#je-joint').value),started_at:T($('#je-s').value),ended_at:T($('#je-e').value),worker_id:+$('#je-w').value||0,job_name:$('#je-name').value.trim()};
    const old={project_id:j.projectId,unit_no:j.unit,item_code:j.code,joint_no:j.joint,started_at:j.start,ended_at:j.end,worker_id:j.worker,job_name:j.name},er=m=>$('#je-err').textContent=m;
    if(!v.unit_no||!v.item_code||!v.joint_no||!v.started_at)return er('필수 칸은 비울 수 없습니다.');if(v.ended_at&&v.ended_at<v.started_at)return er('종료가 시작보다 앞섭니다.');
    const out=j.passes.find(p=>(p.s&&p.s<v.started_at)||(p.e&&v.ended_at&&p.e>v.ended_at));if(out){log('UpdateJob',{job:{job_id:j.id}},'InvalidArgument (패스가 구간 밖)');return er(out.no+'패스가 작업 구간 밖으로 나갑니다. 패스를 먼저 고치세요.')}
    const m=Object.keys(v).filter(k=>v[k]!==old[k]);if(!m.length)return er('바뀐 칸이 없습니다.');
    const keyCh=m.some(k=>['project_id','unit_no','item_code','joint_no','started_at'].includes(k)),P2=P(v.project_id);
    if(!P2.items.find(i=>i.unit===v.unit_no&&i.code===v.item_code))P2.items.push({id:id(),unit:v.unit_no,code:v.item_code,name:'(이름 없음 — 공사 탭에서)'});
    Object.assign(j,{projectId:v.project_id,unit:v.unit_no,code:v.item_code,joint:v.joint_no,start:v.started_at,end:v.ended_at,worker:v.worker_id,name:v.job_name});
    if(keyCh)j.key=`JOB-${P2.no}_${j.unit}-${j.code}-${j.joint.replace(/^DGT-/,'').replace(/-/g,'')}-${j.start.slice(0,10).replace(/-/g,'')}_${Math.random().toString(16).slice(2,6).toUpperCase()}`;
    const body=Object.fromEntries(m.map(k=>[k,k.endsWith('_at')?iso(v[k]):v[k]]));log('UpdateJob',{job:{job_id:j.id,...body},update_mask:{paths:m}},keyCh?'공통키 · 작업 키가 다시 만들어짐 → 응답 Job으로 갱신':'');render()}
});
