publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  fluent_ui: 4.16.1
  provider: ^6.1.5
  get_it: ^8.2.0
  pdfrx: ^2.2.18
  neon_timeline_flutter: ^16.0.1
  photo_view: ^0.15.0
  cached_network_image: ^4.0.0
  video_player: ^2.14.0
  chewie: ^1.17.1
  just_audio: ^0.10.6
  waveform_visualizer: ^1.0.0
  intl: ^0.20.2
  fl_chart: ^1.2.0
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
